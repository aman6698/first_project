<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IMS Inventory Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  /* Brand */
  --purple:#3B82E8;
  --purple-dark:#DDE8F8;
  --purple-glow:rgba(59,130,232,.42);
  /* Surfaces */
  --bg:#071429;
  --card:#122A4E;
  --line:#22406F;
  --text:#E9F1FB;
  --text-mute:#92A7C9;
  /* Status */
  --green:#2F9E5B; --green-bg:#E4F6EC;
  --yellow:#B8860B; --yellow-bg:#FBF1D3;
  --red:#D64550; --red-bg:#FCE6E8;
  --blue:#3B6FD6; --blue-bg:#E6EEFB;
  /* Effects */
  --shadow-sm:0 1px 2px rgba(31,35,64,.05), 0 1px 3px rgba(31,35,64,.06);
  --shadow-md:0 6px 18px rgba(31,35,64,.09);
  --shadow-lg:0 14px 40px rgba(31,35,64,.16);
  --radius:14px;
  --font-head:'Space Grotesk','Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;}
html{scroll-behavior:smooth;}
body{
  margin:0;
  font-family:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(1100px 500px at 100% -8%, rgba(59,130,232,.16), transparent 60%),
    radial-gradient(900px 500px at -10% 110%, rgba(46,124,230,.13), transparent 55%),
    var(--bg);
  -webkit-font-smoothing:antialiased;
}
button{cursor:pointer; font-family:inherit;}
::selection{background:var(--purple-glow);}

.app{display:flex; min-height:100vh;}

/* ---- sidebar ---- */
.sidebar{
  width:230px; position:fixed; left:0; top:0; bottom:0; padding:18px 14px; overflow-y:auto; color:#EAE7FB;
  background:linear-gradient(185deg,#0E2144 0%, #0A1830 55%, #060F1E 100%);
  box-shadow:4px 0 24px rgba(20,15,45,.28);
  border-right:1px solid rgba(255,255,255,.05);
}
.sidebar::-webkit-scrollbar{width:10px;}
.sidebar::-webkit-scrollbar-track{background:transparent;}
.sidebar::-webkit-scrollbar-thumb{background:#5E4FA0; border-radius:8px; border:3px solid transparent; background-clip:padding-box;}
.sidebar::-webkit-scrollbar-thumb:hover{background:#7E6DC7; background-clip:padding-box;}
.logo{
  padding:6px 8px 14px; font-family:var(--font-head); font-weight:700; font-size:18px; letter-spacing:.3px;
  border-bottom:1px solid rgba(255,255,255,.09); margin-bottom:14px;
  background:linear-gradient(90deg,#FFFFFF,#CFE2FF); -webkit-background-clip:text; background-clip:text; color:transparent;
}
.logo small{display:block; -webkit-text-fill-color:#8FB4E6; color:#8FB4E6; font-size:11px; margin-top:5px; font-weight:500; letter-spacing:.2px;}
.menu-section{
  font-size:10.5px; font-weight:700; letter-spacing:1.2px; text-transform:uppercase;
  color:#7E86B8; padding:14px 12px 6px; margin-top:2px;
}
.menu-item{
  padding:9px 11px; border-radius:11px; margin:3px 0; font-size:14px; font-weight:500; color:#C4BDE6;
  display:flex; align-items:center; gap:11px; position:relative; transition:background .18s, color .18s, transform .12s;
}
.menu-item .mi-ico{
  flex:0 0 auto; width:30px; height:30px; border-radius:9px; display:flex; align-items:center; justify-content:center;
  font-size:15px; background:rgba(255,255,255,.05); box-shadow:inset 0 0 0 1px rgba(255,255,255,.07); transition:background .18s, transform .15s;
}
.menu-item .mi-label{opacity:.92;}
.menu-item:hover{background:rgba(255,255,255,.07); color:#fff; transform:translateX(2px);}
.menu-item:hover .mi-ico{background:rgba(255,255,255,.12); transform:scale(1.05);}
.menu-item.active{
  background:linear-gradient(90deg, rgba(59,130,232,.30), rgba(59,130,232,.08));
  color:#fff; box-shadow:inset 0 0 0 1px rgba(120,165,240,.28);
}
.menu-item.active .mi-ico{background:rgba(255,255,255,.16);}
.menu-item.active::before{
  content:""; position:absolute; left:-6px; top:22%; bottom:22%; width:4px; border-radius:4px;
  background:linear-gradient(#6FA8FF,#3B82E8); box-shadow:0 0 12px var(--purple-glow);
}

/* ---- main ---- */
.main{margin-left:230px; width:calc(100% - 230px);}
.topbar{
  height:62px; background:rgba(7,18,36,.82); backdrop-filter:saturate(160%) blur(10px);
  border-bottom:1px solid var(--line); display:flex; align-items:center; padding:0 28px; position:sticky; top:0; z-index:50;
  box-shadow:0 1px 0 rgba(31,35,64,.03);
}
.topbar-title{font-family:var(--font-head); font-weight:600; font-size:15px; color:var(--purple-dark); letter-spacing:.2px;}
.content{padding:28px;}

.page-title{font-family:var(--font-head); font-size:22px; font-weight:700; margin:0 0 4px; letter-spacing:-.3px; color:var(--purple-dark);}
.page-subtitle{color:var(--text-mute); font-size:13px; margin-bottom:22px; max-width:820px; line-height:1.5;}

/* ---- stat cards ---- */
.stats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:20px;}
.stat{
  position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;
  cursor:pointer; overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow .2s, transform .2s, border-color .2s;
}
.stat::after{content:""; position:absolute; left:0; top:0; bottom:0; width:4px; background:linear-gradient(var(--purple),#4A90F0); opacity:.85;}
.stat:hover{box-shadow:var(--shadow-md); transform:translateY(-3px); border-color:#D9D8F2;}
.stat .label{font-size:12px; color:var(--text-mute); font-weight:600; text-transform:uppercase; letter-spacing:.4px;}
.stat .value{font-family:var(--font-head); font-size:23px; font-weight:700; margin-top:8px; color:var(--purple-dark); letter-spacing:-.5px;}

.zones{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:24px;}
.zone-card{border-radius:var(--radius); padding:18px 20px; border:1px solid transparent; box-shadow:var(--shadow-sm); transition:transform .2s, box-shadow .2s;}
.zone-card:hover{transform:translateY(-3px); box-shadow:var(--shadow-md);}
.zone-card .label{font-size:12.5px; font-weight:700; text-transform:uppercase; letter-spacing:.4px; opacity:.9;}
.zone-card .value{font-family:var(--font-head); font-size:20px; font-weight:700; margin-top:8px; letter-spacing:-.3px;}
.zone-card.red{background:linear-gradient(135deg,#FDEBED,#FBDDE0); color:var(--red); border-color:#F6CBD0;}
.zone-card.yellow{background:linear-gradient(135deg,#FBF3D9,#F7EAC1); color:var(--yellow); border-color:#EFDDA5;}
.zone-card.green{background:linear-gradient(135deg,#E6F7EE,#D7F1E2); color:var(--green); border-color:#C0E7CF;}
.zone-card.blue{background:linear-gradient(135deg,#E9F1FC,#DBE8FA); color:var(--blue); border-color:#C6D9F5;}

/* ---- box / table ---- */
.box{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:20px; margin-top:18px; box-shadow:var(--shadow-sm); transition:box-shadow .2s;}
.box:hover{box-shadow:var(--shadow-md);}
.box h3{font-family:var(--font-head); margin:0 0 14px; font-size:15px; font-weight:600; color:var(--purple-dark); letter-spacing:-.1px;}
.table-wrap{overflow-x:auto; border-radius:10px;}
.table-wrap::-webkit-scrollbar{height:0; background:transparent;}  /* native horizontal bar hide - sticky proxy dikhega */
/* Sticky bottom scrollbar - table jab tak screen pe hai, ye niche hamesha dikhta hai */
.btm-scroll{position:sticky; bottom:0; overflow-x:auto; overflow-y:hidden; z-index:6; margin-top:2px; background:var(--card); border-radius:8px;}
.btm-scroll::-webkit-scrollbar{height:13px;}
.btm-scroll::-webkit-scrollbar-thumb{background:rgba(255,255,255,.30); border-radius:8px;}
.btm-scroll::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,.45);}
table{width:100%; border-collapse:collapse;}
th{background:#16335C; color:var(--text-mute); font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.5px; text-align:left; padding:11px 13px; border-bottom:1px solid var(--line); white-space:nowrap;}
td{padding:11px 13px; border-bottom:1px solid #1A5560; font-size:13px; white-space:nowrap;}
tbody tr:last-child td, table tr:last-child td{border-bottom:none;}
tr:hover td{background:#0E2649;}

.badge{display:inline-block; padding:4px 11px; border-radius:999px; font-size:11px; font-weight:800; letter-spacing:.2px; box-shadow:inset 0 0 0 1px rgba(0,0,0,.04);}
.badge.red{background:var(--red-bg); color:var(--red);}
.badge.yellow{background:var(--yellow-bg); color:var(--yellow);}
.badge.green{background:var(--green-bg); color:var(--green);}
.badge.blue{background:var(--blue-bg); color:var(--blue);}
.badge.future{background:var(--blue-bg); color:var(--blue);}

/* ---- form ---- */
.form{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:22px; max-width:900px; box-shadow:var(--shadow-sm);}
.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.form-group label{display:block; font-size:12px; font-weight:700; color:var(--text-mute); margin-bottom:6px; letter-spacing:.2px;}
.form-group input, .form-group select{
  width:100%; padding:11px 13px; border:1px solid var(--line); border-radius:10px; outline:none; font-size:13.5px;
  background:#0E2649; color:var(--text); transition:border-color .18s, box-shadow .18s, background .18s;
}
.form-group input:focus, .form-group select:focus{border-color:var(--purple); background:#143A66; box-shadow:0 0 0 3px var(--purple-glow);}
.form-note{font-size:12px; color:var(--text-mute); margin-top:6px; line-height:1.5;}
.form-error{font-size:12.5px; color:var(--red); margin-top:8px; display:none; font-weight:600;}

.btn{
  border:1px solid rgba(255,255,255,.22); border-radius:9px; padding:9px 18px; font-weight:600; font-size:13.5px; color:#E8EEF8;
  background:rgba(255,255,255,.07); box-shadow:none;
  transition:transform .14s, box-shadow .18s, filter .18s;
}
.btn:hover{background:rgba(255,255,255,.14); border-color:rgba(255,255,255,.42); transform:translateY(-1px);}
.btn:active{transform:translateY(0);}
.btn-row{margin-top:18px;}

.search-box{width:300px; max-width:100%; padding:11px 14px; border:1px solid var(--line); border-radius:11px; outline:none; font-size:13px; margin-bottom:16px; background:#0E2649; transition:border-color .18s, box-shadow .18s;}
.search-box:focus{border-color:var(--purple); background:#143A66; box-shadow:0 0 0 3px var(--purple-glow);}

/* ---- edit modal ---- */
.modal-overlay{position:fixed; inset:0; background:rgba(20,15,45,.5); backdrop-filter:blur(4px); display:flex; align-items:center; justify-content:center; z-index:1000; animation:fadeIn .18s ease;}
.modal-box{background:var(--card); border-radius:18px; padding:24px; width:440px; max-width:92vw; max-height:88vh; overflow-y:auto; box-shadow:var(--shadow-lg); border:1px solid var(--line); animation:pop .2s ease;}
.modal-box h3{margin:0 0 16px; font-size:17px; color:var(--purple-dark); font-weight:800;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{from{opacity:0; transform:translateY(8px) scale(.98)}to{opacity:1; transform:none}}

/* ---- category cards ---- */
.breadcrumb{font-size:13px; color:var(--text-mute); margin-bottom:16px;}
.breadcrumb span{color:var(--purple); cursor:pointer; font-weight:700;}
.cat-grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px; margin-top:4px;}
.cat-card{
  position:relative; background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px;
  cursor:pointer; overflow:hidden; box-shadow:var(--shadow-sm); transition:box-shadow .2s, transform .2s, border-color .2s;
}
.cat-card::before{content:""; position:absolute; inset:0 auto 0 0; width:3px; background:linear-gradient(var(--purple),#4A90F0); opacity:0; transition:opacity .2s;}
.cat-card:hover{box-shadow:var(--shadow-md); transform:translateY(-3px); border-color:#D9D8F2;}
.cat-card:hover::before{opacity:1;}
.cat-card .cat-name{font-weight:700; font-size:14.5px; margin-bottom:8px; color:var(--purple-dark);}
.cat-card .cat-count{font-size:12.5px; color:var(--text-mute); font-weight:500;}

/* ---- stylish stat cards (icon + accent) ---- */
.stat{display:flex; align-items:center; gap:14px;}
.stat .stat-body{min-width:0;}
.stat .stat-ico{
  flex:0 0 auto; width:46px; height:46px; border-radius:12px; display:flex; align-items:center; justify-content:center;
  font-size:22px; background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.09);
}
.stat::after{background:linear-gradient(var(--purple),#8FB4FF);}
.stat.s1::after{background:linear-gradient(#5B8DEF,#8FB4FF);}
.stat.s2::after{background:linear-gradient(#22B07E,#63E3B5);}
.stat.s3::after{background:linear-gradient(#B8860B,#F0CE6A);}
.stat.s4::after{background:linear-gradient(#C05CE0,#E9A0F5);}
.stat.s1 .stat-ico{color:#8FB4FF;}
.stat.s2 .stat-ico{color:#63E3B5;}
.stat.s3 .stat-ico{color:#F0CE6A;}
.stat.s4 .stat-ico{color:#E9A0F5;}
.stat:hover .stat-ico{background:rgba(255,255,255,.11);}
.stat.s1{background:linear-gradient(135deg, rgba(91,141,239,.14), var(--card));}
.stat.s2{background:linear-gradient(135deg, rgba(34,176,126,.14), var(--card));}
.stat.s3{background:linear-gradient(135deg, rgba(184,134,11,.16), var(--card));}
.stat.s4{background:linear-gradient(135deg, rgba(192,92,224,.14), var(--card));}
.stat.s1 .stat-ico{box-shadow:inset 0 0 0 1px rgba(143,180,255,.4);}
.stat.s2 .stat-ico{box-shadow:inset 0 0 0 1px rgba(99,227,181,.4);}
.stat.s3 .stat-ico{box-shadow:inset 0 0 0 1px rgba(240,206,106,.4);}
.stat.s4 .stat-ico{box-shadow:inset 0 0 0 1px rgba(233,160,245,.4);}

/* ---- page header accent (applies to every page) ---- */
.page-title{position:relative; padding-bottom:10px;}
.page-title::after{content:""; position:absolute; left:0; bottom:0; width:46px; height:3px; border-radius:3px; background:linear-gradient(90deg,var(--purple),transparent);}

/* ---- section header accent bar ---- */
.box h3{position:relative; padding-left:13px;}
.box h3::before{content:""; position:absolute; left:0; top:2px; bottom:2px; width:4px; border-radius:4px; background:linear-gradient(var(--purple),#8FB4FF);}
.form h3{position:relative; padding-left:13px;}
.form h3::before{content:""; position:absolute; left:0; top:2px; bottom:2px; width:4px; border-radius:4px; background:linear-gradient(var(--purple),#8FB4FF);}

/* ---- stock value distribution bar ---- */
.zonebar{display:flex; height:16px; border-radius:9px; overflow:hidden; background:rgba(255,255,255,.06); box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
.zseg{height:100%; transition:width .7s cubic-bezier(.4,0,.2,1);}
.zdot{display:inline-block; width:10px; height:10px; border-radius:50%; margin-right:6px; vertical-align:middle;}

/* ---- entrance animation ---- */
@keyframes riseIn{from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:none;}}
.stat,.zone-card,.cat-card,.box{animation:riseIn .34s ease both;}

/* ---- scroll to top ---- */
#toTop{
  position:fixed; right:24px; bottom:24px; width:46px; height:46px; border-radius:50%;
  border:1px solid rgba(255,255,255,.2); background:linear-gradient(135deg,var(--purple),#2E63C4);
  color:#fff; font-size:20px; line-height:1; box-shadow:0 10px 26px rgba(0,0,0,.4);
  opacity:0; pointer-events:none; transform:translateY(12px); transition:opacity .25s, transform .25s, filter .18s; z-index:300;
}
#toTop.show{opacity:1; pointer-events:auto; transform:none;}
#toTop:hover{filter:brightness(1.12);}

@media(max-width:900px){
  .stats,.zones{grid-template-columns:repeat(2,1fr);}
  .form-grid{grid-template-columns:1fr;}
}
@media(max-width:600px){
  .sidebar{width:186px;}
  .main{margin-left:186px; width:calc(100% - 186px);}
  .stats,.zones{grid-template-columns:1fr;}
  .content{padding:18px;}
}
</style>
</head>
<body>

<div class="app">

  <div class="sidebar">
    <div class="logo">TEPL &middot; IMS
      <small>Inventory Dashboard</small>
    </div>
    <div id="menu"></div>
  </div>

  <div class="main">
    <div class="topbar">
      <div class="topbar-title" id="topbarTitle">Dashboard</div>
      <div style="margin-left:auto; display:flex; align-items:center; gap:10px;">
        <div style="position:relative;">
          <button id="alertBell" onclick="goRedAlerts()" title="Low-stock (red zone) items — click to see order list"
            style="position:relative; border:1px solid var(--line); background:var(--card); color:var(--text); border-radius:9px; padding:8px 11px; cursor:pointer; font-size:15px; line-height:1;">&#128276;<span id="alertCount" style="display:none; position:absolute; top:-7px; right:-7px; background:var(--red); color:#fff; font-size:10px; font-weight:800; min-width:18px; height:18px; line-height:18px; text-align:center; border-radius:10px; padding:0 4px;"></span></button>
        </div>
      </div>
    </div>
    <div class="content" id="page"></div>
  </div>

</div>

<button id="toTop" title="Back to top" onclick="window.scrollTo({top:0,behavior:'smooth'})">&#8593;</button>

<script>
/* ===================== DATA ===================== */
/* Same data as before — sirf UI simplify ki hai */

let db = JSON.parse(localStorage.getItem("IMS_SIMPLE_DB"));

if(!db){
  db = {
    items:[
      { sku:"IMS-001", name:"Copper Cable 1.2mm", category:"IMS Consumable Items", unit:"KG", qty:850, rate:620, min:200, max:1200, avgDailyConsumption:8, leadTimeDays:10, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' },
      { sku:"IMS-002", name:"CRGO Steel M4", category:"IMS Sheet 6531 KVA", unit:"KG", qty:1200, rate:185, min:500, max:2000, avgDailyConsumption:15, leadTimeDays:15, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' },
      { sku:"IMS-003", name:"Transformer Oil", category:"IMS Consumable Items", unit:"Litre", qty:75, rate:145, min:100, max:500, avgDailyConsumption:4, leadTimeDays:7, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' },
      { sku:"IMS-004", name:"MS Sheet 5mm", category:"IMS Sheet 7775 KVA", unit:"KG", qty:350, rate:92, min:200, max:800, avgDailyConsumption:6, leadTimeDays:12, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' },
      { sku:"IMS-005", name:"Bearing 6205", category:"IMS Repair and Maintenance", unit:"PCS", qty:35, rate:480, min:20, max:100, avgDailyConsumption:1.5, leadTimeDays:5, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' },
      { sku:"IMS-006", name:"Insulation Paper", category:"IMS Consumable Items", unit:"KG", qty:180, rate:210, min:100, max:500, avgDailyConsumption:3, leadTimeDays:8, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' },
      { sku:"IMS-007", name:"Copper Strip", category:"IMS Sheet Repair 6531 KVA", unit:"KG", qty:650, rate:710, min:200, max:1000, avgDailyConsumption:5, leadTimeDays:14, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' },
      { sku:"IMS-008", name:"GI Nut Bolt Set", category:"IMS Sheet repair 5400 KVA/1000 KVA", unit:"PCS", qty:90, rate:35, min:50, max:300, avgDailyConsumption:2, leadTimeDays:4, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' },
      { sku:"IMS-009", name:"Grinding Wheel", category:"IMS Sheet SCRAP", unit:"PCS", qty:15, rate:180, min:20, max:100, avgDailyConsumption:0.5, leadTimeDays:3, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' },
      { sku:"IMS-010", name:"Hand Tool Set", category:"IMS Sheet Tools", unit:"SET", qty:42, rate:2500, min:10, max:80, avgDailyConsumption:0.2, leadTimeDays:6, safetyFactor:1.5, tfpSerial:'', season:'REG/LOW' }
    ],
    transactions:[],
    purchaseOrders:[],
    indents:[],
    jobs:[],
    bomTemplates:[],
    users:[
      { username:"admin", password:"admin123", role:"Admin" },
      { username:"store", password:"store123", role:"Store" },
      { username:"purchase", password:"purchase123", role:"Purchase" },
      { username:"production", password:"prod123", role:"Production" }
    ],
    auditLog:[],
    vendors:[
      { name:"ABC Electricals", contact:"9876543210", address:"Plot 14, Industrial Area, Kanpur", gst:"09ABCDE1234F1Z5" },
      { name:"National Steel Suppliers", contact:"9876501234", address:"Sector 5, Steel Market, Lucknow", gst:"09XYZAB5678G1Z2" }
    ]
  };
  save();
}
if(!db.purchaseOrders) db.purchaseOrders = [];
if(!db.vendors) db.vendors = [];
if(!db.categorySheetLinks) db.categorySheetLinks = {};
if(!db.indents) db.indents = [];
if(!db.deliverySchedule) db.deliverySchedule = [];
if(!db.indentDocs) db.indentDocs = [];
if(!db.jobs) db.jobs = [];
if(!db.bomTemplates) db.bomTemplates = [];
if(!db.boms) db.boms = [];
if(!db.models) db.models = [];
if(!db.lots) db.lots = [];
if(!db.transformers) db.transformers = [];
if(!db.lotsInit){

/* ===================== ZONE LOGIC ===================== */
/* Same formula jo pehle se working thi: */
function getZone(item){
  // Naya rule: zone poori tarah MAX ke percentage pe based hai
  //   qty > max              -> Blue   (excess stock)
  //   qty >= 66% of max      -> Green  (healthy stock)
  //   qty >= 33% of max      -> Yellow (low - order soon)
  //   qty < 33% of max       -> Red    (critical - order now)
  const q = Number(item.qty), max = Number(item.max);
  if(q > max)          return {name:"Blue",   cls:"blue",   desc:"Excess stock"};
  if(q >= max*0.66)    return {name:"Green",  cls:"green",  desc:"Healthy stock"};
  if(q >= max*0.33)    return {name:"Yellow", cls:"yellow", desc:"Low - order soon"};
  return {name:"Red", cls:"red", desc:"Critical - order now"};
}

function buildMenu(active){
  currentMenuActive = active;
  const menu = document.getElementById("menu");
  menu.innerHTML = "";
  const visible = MENU.filter(m => currentUser && m.roles.includes(currentUser.role));
  let lastSection = null;
  visible.forEach((m)=>{
    if(m.section && m.section !== lastSection){
      const sec = document.createElement("div");
      sec.className = "menu-section";
      sec.textContent = m.section;
      menu.appendChild(sec);
      lastSection = m.section;
    }
    const div = document.createElement("div");
    div.className = "menu-item" + (m.id===active ? " active" : "");
    div.innerHTML = `<span class="mi-ico">${m.icon}</span><span class="mi-label">${m.label}</span>`;
    div.onclick = () => openPage(m.id);
    menu.appendChild(div);
  });

     Wapas on karna ho to yahan se logout button ka code dobara add kar dena. */
}

function openPage(id){
  const allowed = MENU.find(m=>m.id===id);
  if(!allowed || !currentUser || !allowed.roles.includes(currentUser.role)){

  buildMenu(id);

  const sku = document.getElementById("niSku").value.trim();

  if(!sku || !name || !category || !unit){ err.textContent="SKU, description, category and unit are required."; err.style.display="block"; return; }
  if(db.items.some(it=>it.sku.toLowerCase()===sku.toLowerCase())){ err.textContent="This SKU already exists."; err.style.display="block"; return; }
  if(max<0 || rate<0 || qty<0 || leadTimeDays<0 || safety<0){ err.textContent="No negative numbers."; err.style.display="block"; return; }

/* Fetch item's live rate from the category's linked Google Sheet (CSV format).
   Sheet mein koi bhi column header "SKU" aur "Rate" jaisa hona chahiye. */
async function fetchRateFromSheet(sku, category){
  const url = db.categorySheetLinks[category];
  if(!url) return null;

  try{
    const res = await fetch(url);
    if(!res.ok) return null;
    const text = await res.text();
    const rows = text.split("\n").map(r => r.split(",").map(c=>c.replace(/"/g,"").trim()));
    if(!rows.length) return null;

    const header = rows[0].map(h=>h.toLowerCase());
    const skuCol = header.findIndex(h=>h.includes("sku"));
    const rateCol = header.findIndex(h=>h.includes("rate"));
    if(skuCol===-1 || rateCol===-1) return null;

    const match = rows.find((r,i)=> i>0 && r[skuCol] && r[skuCol].toLowerCase()===sku.toLowerCase());
    if(!match) return null;

    const rate = parseFloat(match[rateCol]);
    return isNaN(rate) ? null : rate;
  }catch(e){
    return null;
  }
}

/* How much of an item is reserved for active jobs (transformers)
   (required in BOM but not yet issued from store) */
function reservedQtyForItem(sku){
  // Reserved / Jobs feature removed - no material is reserved now
  return 0;
}

function availableQty(item){
  return Math.max(Number(item.qty) - reservedQtyForItem(item.sku), 0);
}

/* Safety factor (default 1.5 like the master sheet) */
function safetyFactor(it){ const s = Number(it.safetyFactor); return s>0 ? s : 1.5; }

/* Lead time = days for item stock to arrive */
function leadTime(it){ return Number(it.leadTimeDays) || 0; }

/* Max Level is the entered value. Avg daily consumption is derived:
   Avg Daily Consumption = Max / (Lead Time x Safety Factor). */
function avgConsumption(it){
  const lt = leadTime(it), sf = safetyFactor(it), max = Number(it.max);
  if(lt>0 && sf>0) return max/(lt*sf);
  return 0;
}
/* Kept for backward compatibility (not used for input now) */
function computedAvg(max, lead, safety){
  max=Number(max); lead=Number(lead); safety=Number(safety);
  return (lead>0 && safety>0) ? max/(lead*safety) : 0;
}

/* ===================== FIFO LOT COSTING ===================== */
/* Har inward/purchase ka ek lot banta hai (rate + invoice). Out hone par
   pehle aaya lot pehle us rate se consume hota hai (FIFO). */
function addLot(sku, qty, rate, invoiceNo){
  qty = Number(qty);
  if(!sku || !(qty>0)) return;
  db.lots.push({
    id: "LOT-"+Date.now()+"-"+Math.floor(Math.random()*10000),
    sku, qty, rate: Number(rate)||0, remaining: qty,
    invoiceNo: invoiceNo || "", date: new Date().toLocaleDateString("en-IN")
  });
}
function fifoLots(sku){ return db.lots.filter(l=>l.sku===sku && l.remaining>0); } // insertion order = oldest first
function fifoAvailable(sku){ return fifoLots(sku).reduce((a,l)=>a+l.remaining,0); }
/* qty consume karo FIFO order me; total cost return karo (lots ghata do).
   Agar lot data kam pade (jaise purana opening stock), to item rate se cover karo. */
function consumeFIFO(sku, qty){
  let need = Number(qty), cost = 0;
  for(const l of fifoLots(sku)){
    if(need<=0) break;
    const take = Math.min(l.remaining, need);
    l.remaining -= take; need -= take; cost += take * Number(l.rate);
  }
  if(need > 0){
    const it = db.items.find(i=>i.sku===sku);
    cost += need * (it ? Number(it.rate) : 0);
  }
  return { cost };
}
function transformerCost(serial){
  return db.transactions.filter(t=>t.type==="OUT" && t.tfpSerial===serial).reduce((a,t)=>{
    const q = Number(t.qty)||0, ret = Number(t.returned||0), cost = Number(t.cost)||0;
    const net = q>0 ? cost*((q-ret)/q) : cost;   // returned qty ka cost minus
    return a + net;
  }, 0);
}

function daysLeft(it){
  const c = avgConsumption(it);
  if(!c || c<=0) return null;
  return Math.round(Number(it.qty) / c);
}

/* Urgent when days-of-stock is at or below the lead time
   (i.e. stock may run out before new stock arrives) */
function leadTimeUrgent(it){
  const dl = daysLeft(it);
  const lt = leadTime(it);
  return dl !== null && lt > 0 && dl <= lt;
}

function reorderQty(it){
  const need = it.max - it.qty;
  return need>0 ? Math.round(need) : 0;
}

  const item = db.items.find(i=>i.sku===sku);

  const err = document.getElementById("editError");

  const name = document.getElementById("editName").value.trim();
  const tfpSerial = document.getElementById("editTfp").value.trim();
  const category = document.getElementById("editCategory").value;
  const unit = document.getElementById("editUnit").value.trim();
  const season = document.getElementById("editSeason").value;
  const opening = Number(document.getElementById("editOpening").value);
  const qty = Number(document.getElementById("editQty").value);
  const rate = Number(document.getElementById("editRate").value);
  const max = Number(document.getElementById("editMax").value);
  const safety = Number(document.getElementById("editSafety").value);
  const leadTimeDays = Number(document.getElementById("editLeadTime").value);

  if(!name || !unit || qty<0 || opening<0 || rate<0 || max<0 || safety<0 || leadTimeDays<0){
    err.textContent = "Fill all fields correctly (no negatives).";
    err.style.display = "block";
    return;
  }

  const sf = safety>0 ? safety : 1.5;
  item.name = name; item.tfpSerial = tfpSerial; item.category = category; item.unit = unit; item.season = season;
  item.openingStock = opening; item.qty = qty; item.rate = rate;
  item.safetyFactor = sf;
  item.leadTimeDays = leadTimeDays;
  item.max = max;
  item.avgDailyConsumption = computedAvg(max, leadTimeDays, sf);   // Avg = Max / (Lead x Safety)

  save();
  logAction(`Item edited: ${item.sku} - ${name}`);
  closeItemEditModal();
  refreshItemsView();
}

function filterItems(){
  refreshItemsView = filterItems;
  const q = document.getElementById("itemSearch").value.toLowerCase().trim();
  const filtered = !q ? db.items : db.items.filter(it =>
    it.sku.toLowerCase().includes(q) || it.name.toLowerCase().includes(q) || it.category.toLowerCase().includes(q));

  const cat = document.getElementById("inCategory").value;
  const items = cat ? db.items.filter(it=>it.category===cat) : [];

  sel.innerHTML = items.length
    ? `<option value="">Select item</option>${itemOptionsFrom(items)}`

function saveInward(){
  const sku = document.getElementById("inItem").value;
  const qty = Number(document.getElementById("inQty").value);
  const status = document.getElementById("inStatus").value;
  const person = document.getElementById("inPerson").value.trim();
  const ref = document.getElementById("inRef").value.trim();
  const invoice = document.getElementById("inInvoice").value.trim();
  const err = document.getElementById("inError");

  if(!sku || !qty || qty<=0 || !person){
    err.textContent = "Category, item, quantity and name required.";
    err.style.display = "block";
    return;
  }
  err.style.display = "none";

  const item = db.items.find(i=>i.sku===sku);
  const rateInput = document.getElementById("inRate").value;
  const rate = rateInput!=="" ? Number(rateInput) : Number(item.rate)||0;

  if(status === "Accepted"){
    item.qty = Number(item.qty) + qty;
    addLot(sku, qty, rate, invoice);              // FIFO lot banao
    if(rate>0) item.rate = rate;                  // latest purchase rate item pe update
  }
  /* Stock doesn't change for Hold/Rejected - decided later on the Hold/Reject page */

  db.transactions.push({
    type:"IN", sku, itemName:item.name, qty, person, ref, invoice, rate, status,
    date: new Date().toLocaleDateString("en-IN")
  });
  save();
  logAction(`Inward entry: ${item.name} x ${qty} (${status}) by ${person}${invoice?` [inv ${invoice}]`:''}`);
  pageInward();
}

function resolveHold(idx, newStatus){
  const t = db.transactions[idx];
  t.status = newStatus;
  if(newStatus === "Accepted"){
    const item = db.items.find(i=>i.sku===t.sku);
    if(item) item.qty = Number(item.qty) + Number(t.qty);
  }
  save();
  pageHoldReject();
}

/* SKU/naam se item resolve karke naam + available dikhao */
function skuFromIndentSearch(){
  const raw = (document.getElementById("indSearch").value||"").trim();
  if(!raw) return null;
  // format "SKU — Name"; ya sirf SKU; ya sirf naam
  let sku = raw.split("—")[0].trim();
  let item = db.items.find(i=>i.sku.toLowerCase()===sku.toLowerCase());
  if(!item) item = db.items.find(i=>i.name.toLowerCase()===raw.toLowerCase());
  if(!item) item = db.items.find(i=>raw.toLowerCase().includes(i.sku.toLowerCase()) || i.name.toLowerCase()===raw.split("—").slice(1).join("—").trim().toLowerCase());
  return item || null;
}
function resolveIndentItem(){
  const item = skuFromIndentSearch();
  document.getElementById("indName").value = item ? item.name : "";
  document.getElementById("indAvail").value = item ? (item.qty+" "+item.unit) : "";
  validateIndentQtyLive();
}

/* Indent quantity ko stock ke saath live check karo.
   Sirf warning dikhata hai; final save par bhi hard validation hoti hai. */
function validateIndentQtyLive(){
  const qtyEl = document.getElementById("indQty");
  const err = document.getElementById("indError");
  if(!qtyEl || !err) return true;

  const item = skuFromIndentSearch();
  const qty = Number(qtyEl.value);

  if(!item || !qty) {
    if(!qty || qty<=0) err.style.display = "none";
    return true;
  }

  /* Agar same item draft me pehle se hai to nayi qty + existing qty check hogi. */
  const existingQty = indentDraft
    .filter(l=>l.sku===item.sku)
    .reduce((sum,l)=>sum+Number(l.qty||0),0);

  const totalRequired = existingQty + qty;
  if(totalRequired > Number(item.qty)){
    err.innerHTML = `⚠️ <b>${esc(item.name)}</b>: Available quantity is <b>${item.qty} ${esc(item.unit)}</b>, but the indent needs a total of <b>${totalRequired} ${esc(item.unit)}</b>. This indent cannot be saved for that quantity.`;
    err.style.display = "block";
    return false;
  }

  err.style.display = "none";
  return true;
}

function generateIndentId(){
  const year = new Date().getFullYear();
  const count = db.indents.filter(i=>i.id && i.id.startsWith("IND-"+year+"-")).length;
  return "IND-"+year+"-"+String(count+1).padStart(3,"0");
}

function addIndentLine(){
  const item = skuFromIndentSearch();
  const qty = Number(document.getElementById("indQty").value);
  const err = document.getElementById("indError");
  if(!item){ err.textContent="Select a valid SKU or item name."; err.style.display="block"; return; }
  if(!qty || qty<=0){ err.textContent="Enter a quantity."; err.style.display="block"; return; }

  /* Same SKU ko dobara add karne par bhi total required > available nahi ja sakta. */
  if(!validateIndentQtyLive()) return;

  err.style.display="none";
  const existing = indentDraft.find(l=>l.sku===item.sku);
  if(existing) existing.qty += qty;
  else indentDraft.push({ sku:item.sku, name:item.name, unit:item.unit, qty });
  document.getElementById("indSearch").value="";
  document.getElementById("indName").value="";
  document.getElementById("indAvail").value="";
  document.getElementById("indQty").value="";
  document.getElementById("indentLinesWrap").innerHTML = indentLinesTable();
}

function saveIndentDoc(){
  if(!indentDraft.length){ alert("Add some items first."); return; }

  /* FINAL STOCK VALIDATION:
     Save ke exact time par current available stock dobara check karo.
     Isse stock beech me kam ho jaane par bhi invalid indent save nahi hoga. */
  const shortages = [];
  const seen = {};
  indentDraft.forEach(l=>{
    seen[l.sku] = (seen[l.sku] || 0) + Number(l.qty||0);
  });

  Object.keys(seen).forEach(sku=>{
    const it = db.items.find(x=>x.sku===sku);
    const required = seen[sku];
    const available = it ? Number(it.qty) : 0;
    if(!it || required > available){
      shortages.push(
        `${it ? it.name : sku}: Available ${available} ${it ? it.unit : ""}, Required ${required} ${it ? it.unit : ""}`
      );
    }
  });

  if(shortages.length){
    const err = document.getElementById("indError");
    if(err){
      err.innerHTML = "⚠️ <b>Indent not saved.</b> Requested quantity exceeds available stock:<br>" +
        shortages.map(s=>`&bull; ${esc(s)}`).join("<br>");
      err.style.display = "block";
      err.scrollIntoView({behavior:"smooth", block:"center"});
    }
    alert("⚠️ Indent not saved. Required quantity is more than available stock. Reduce the quantity and save the indent again.");
    return;
  }

  const h = indentHeader();

  if(editingIndentId){
    const existing = db.indents.find(i=>i.id===editingIndentId && Array.isArray(i.lines));
    if(!existing){
      alert("Indent record not found. Refresh the page and try again.");
      return;
    }
    existing.date = h.date;
    existing.requestedBy = h.person;
    existing.jobType = h.jobType||"Job No";
    existing.job = h.job||"";
    existing.purpose = h.purpose;
    existing.lines = indentDraft.map(l=>({...l}));
    existing.status = "Open";
    save();
    logAction(`Make Indent updated: ${existing.id} (${existing.lines.length} items)`);
    const id = existing.id;
    editingIndentId = null;
    indentDraft = [];
    pageIndent();
    alert(`Make Indent ${id} updated successfully. Naya item isi Make Indent mein add ho gaya.`);
    return;
  }

  db.indents.push({ id:h.id, date:h.date, requestedBy:h.person, jobType:h.jobType||"Job No", job:h.job||"", purpose:h.purpose, lines:indentDraft.slice(), status:"Open" });
  save();
  logAction(`Make Indent saved: ${h.id} (${indentDraft.length} items)`);
  indentDraft = [];
  pageIndent();
  alert(`Indent ${h.id} saved. You can print it. The Inventory team will issue material from the Outward page ("Send to Outward").`);
}

function doIndentOutward(id){
  const ind = db.indents.find(i=>i.id===id && Array.isArray(i.lines));
  const err = document.getElementById("issError");
  if(!ind){ return; }
  const person = (document.getElementById("issPerson").value||"").trim();
  const receiver = (document.getElementById("issReceiver").value||"").trim();
  const receipt = (document.getElementById("issReceipt").value||"").trim();
  if(!person){ err.textContent="Enter issued by (store person's name)."; err.style.display="block"; return; }
  if(!receiver){ err.textContent="Enter requested by (name of person taking it)."; err.style.display="block"; return; }

  // pehle sab validate (all-or-nothing)
  const plan = [];
  const plannedBySku = {};
  for(let i=0;i<ind.lines.length;i++){
    const l = ind.lines[i];
    const it = db.items.find(x=>x.sku===l.sku);
    const q = Number(document.getElementById("issQty_"+i).value);
    if(q<0){ err.textContent="Quantity cannot be negative."; err.style.display="block"; return; }
    if(q>0 && (!it || q>Number(it.qty))){
      err.textContent = `⚠️ ${it?it.name:l.sku}: only ${it?it.qty:0} ${it?it.unit:''} available, cannot issue ${q} ${it?it.unit:''}.`;
      err.style.display="block"; return;
    }
    if(q>0){
      plannedBySku[l.sku] = (plannedBySku[l.sku] || 0) + q;
      plan.push({ it, qty:q });
    }
  }

  /* Duplicate SKU lines ke case me combined issue bhi stock se zyada nahi ho sakta. */
  for(const sku in plannedBySku){
    const it = db.items.find(x=>x.sku===sku);
    if(!it || plannedBySku[sku] > Number(it.qty)){
      err.textContent = `⚠️ ${it?it.name:sku}: total issue is ${plannedBySku[sku]} ${it?it.unit:''}, but only ${it?it.qty:0} ${it?it.unit:''} available. It won't be saved to Outward history.`;
      err.style.display="block";
      return;
    }
  }
  if(!plan.length){ err.textContent="Enter a quantity for at least one item."; err.style.display="block"; return; }
  err.style.display="none";

  const ref = "Indent "+ind.id + (ind.purpose?(" - "+ind.purpose):"");
  const jobNo = ind.job || ind.id;   // job/machine number (indent id fallback)
  plan.forEach(({it,qty})=>{
    const cost = consumeFIFO(it.sku, qty).cost;
    it.qty = Number(it.qty) - qty;
    db.transactions.push({
      type:"OUT", sku:it.sku, itemName:it.name, qty, person, receivedBy:receiver,
      ref, job:jobNo, receipt, tfpSerial:"", cost,
      date:new Date().toLocaleDateString("en-IN")
    });
  });
  ind.status = "Issued";
  save();
  logAction(`Indent ${ind.id} issued via Outward: ${plan.length} item(s) by ${person}`);
  alert(`Material issued for Indent ${ind.id}. Outward history updated.`);
  pendingIndentIssue = null;
  const iw = document.getElementById("outwardIndentIssue"); if(iw) iw.innerHTML = "";
  const oh = document.getElementById("outwardHistory"); if(oh) oh.innerHTML = historyTable("OUT");
}

function savedIndentsTable(){
  let list = db.indents.filter(i=>Array.isArray(i.lines));
  // date range filter (indent date stored as DD/MM/YYYY)
  const fromEl = document.getElementById("indFromDate");
  const toEl = document.getElementById("indToDate");
  const from = fromEl && fromEl.value ? new Date(fromEl.value+"T00:00:00") : null;
  const to   = toEl && toEl.value ? new Date(toEl.value+"T23:59:59") : null;
  if(from || to){
    list = list.filter(ind=>{
      const d = parseINDate(ind.date);
      if(!d) return false;
      if(from && d<from) return false;
      if(to && d>to) return false;
      return true;
    });

  if(!list.length) return `<p class="form-note">${(from||to) ? "No indents in this date range." : "No saved indents yet."}</p>`;
  return `<div class="table-wrap"><table>
    <tr><th>Indent No</th><th>Date</th><th>Requested by</th><th>Items</th><th>Status</th><th>Purpose</th><th></th></tr>

      </td>

function addModel(){
  const code = document.getElementById("mCode").value.trim();
  const name = document.getElementById("mName").value.trim();
  const rating = document.getElementById("mRating").value.trim();
  const err = document.getElementById("mError");
  if(!code){ err.textContent="Model code required."; err.style.display="block"; return; }
  if(db.models.some(m=>m.code.toLowerCase()===code.toLowerCase())){ err.textContent="This model code already exists."; err.style.display="block"; return; }
  err.style.display="none";
  db.models.push({ code, name, rating, lines:[] });
  currentBomModel = code;
  save();
  logAction(`Model created: ${code}`);
  pageModelsBOM();
}

function deleteModel(code){
  const m = db.models.find(x=>x.code===code);
  if(!m) return;
  if(!confirm(`Delete model "${m.code}" and its BOM?`)) return;
  db.models = db.models.filter(x=>x.code!==code);
  if(currentBomModel===code) currentBomModel = db.models.length ? db.models[0].code : null;
  save();
  logAction(`Model deleted: ${code}`);
  pageModelsBOM();
}

function addModelBomLine(){
  const code = document.getElementById("blModel").value;
  const sku = document.getElementById("blItem").value;
  const qty = Number(document.getElementById("blQty").value);
  const err = document.getElementById("blError");
  if(!code){ err.textContent="Create/select a model first."; err.style.display="block"; return; }
  if(!sku || !qty || qty<=0){ err.textContent="Enter item and qty/unit."; err.style.display="block"; return; }
  err.style.display="none";
  const m = db.models.find(x=>x.code===code);
  const existing = m.lines.find(l=>l.sku===sku);
  if(existing) existing.qty = qty; else m.lines.push({ sku, qty });
  currentBomModel = code;
  document.getElementById("blQty").value = "";
  save();
  logAction(`BOM line: ${code} <- ${sku} @ ${qty}/unit`);
  document.getElementById("bomTableBox").innerHTML = renderModelBomTable(code);
}

function removeModelBomLine(code, sku){
  const m = db.models.find(x=>x.code===code);
  if(!m) return;
  m.lines = m.lines.filter(l=>l.sku!==sku);
  save();
  logAction(`BOM line removed: ${code} <- ${sku}`);
  document.getElementById("bomTableBox").innerHTML = renderModelBomTable(code);
}

/* Index-based delete (works even if name has spaces/special chars) */
function deleteModelByIndex(i){
  const m = db.models[i];
  if(!m) return;
  if(!confirm(`Delete model "${m.code}" and its BOM?`)) return;
  const code = m.code;
  db.models.splice(i,1);
  if(currentBomModel===code) currentBomModel = db.models.length ? db.models[0].code : null;
  save();
  logAction(`Model deleted: ${code}`);
  pageModelsBOM();
}

function removeBomLineByIndex(mi, li){
  const m = db.models[mi];
  if(!m) return;
  const line = m.lines[li];
  m.lines.splice(li, 1);
  save();
  if(line) logAction(`BOM line removed: ${m.code} <- ${line.sku}`);
  currentBomModel = m.code;
  document.getElementById("bomTableBox").innerHTML = renderModelBomTable(m.code);
}

function renderSerialInputs(){

  if(n<=0){ wrap.innerHTML = ""; return; }

function renderIssuePreview(){

  if(!m || !m.lines.length){ box.innerHTML = `<p class="form-note">Select a model with a BOM to see the requirement preview.</p>`; return; }

    </h3>

function doIssueBOM(){
  const code = document.getElementById("isModel").value;
  const units = Number(document.getElementById("isUnits").value);
  const ref = document.getElementById("isRef").value.trim();
  const err = document.getElementById("isError");
  const m = db.models.find(x=>x.code===code);

  if(!m || !m.lines.length){ err.textContent="Select a model that has a BOM."; err.style.display="block"; return; }
  if(!units || units<=0){ err.textContent="Enter how many transformers (1 or more)."; err.style.display="block"; return; }

  // Collect serial numbers (one per transformer)
  const serials = [];
  for(let i=0;i<units;i++){
    const el = document.getElementById("serial_"+i);
    const s = el ? el.value.trim() : "";
    if(!s){ err.textContent="Enter a serial number (TFP) for every transformer."; err.style.display="block"; return; }
    serials.push(s);
  }
  const dup = serials.find((s,i)=>serials.indexOf(s)!==i);
  if(dup){ err.textContent=`Serial "${dup}" is repeated. Each transformer needs a unique serial.`; err.style.display="block"; return; }
  const used = serials.find(s=>db.transformers.some(t=>t.serial===s));
  if(used){ err.textContent=`Serial "${used}" already exists. Use a new serial.`; err.style.display="block"; return; }

  // Availability check (BOM x units vs stock)
  const shortages = [];
  m.lines.forEach(l=>{
    const it = db.items.find(i=>i.sku===l.sku);
    const need = l.qty*units, have = it?Number(it.qty):0;
    if(!it || have<need) shortages.push(`${it?it.name:l.sku} - need ${need} ${it?it.unit:''}, stock ${have} ${it?it.unit:''}`);
  });
  if(shortages.length){
    err.innerHTML = "Stock is short, so it can't be issued:<br>&bull; " + shortages.map(esc).join("<br>&bull; ");
    err.style.display = "block";
    return;
  }
  err.style.display = "none";

  const jobRef = ref || (code+" batch");
  // Issue per transformer (per serial) so cost is tracked per TFP, FIFO rate used
  serials.forEach(serial=>{
    db.transformers.push({ serial, model:code, job:jobRef, date:new Date().toLocaleDateString("en-IN") });
    m.lines.forEach(l=>{
      const it = db.items.find(i=>i.sku===l.sku);
      const cost = consumeFIFO(l.sku, l.qty).cost;
      it.qty = Number(it.qty) - l.qty;
      db.transactions.push({
        type:"OUT", sku:l.sku, itemName:it.name, qty:l.qty,
        person:"Production (BOM)", ref:jobRef, job:serial, tfpSerial:serial, cost,
        date:new Date().toLocaleDateString("en-IN")
      });
    });
  });
  save();
  logAction(`Issue by BOM: ${code} x${units} (serials: ${serials.join(", ")})`);
  alert(`${units} × ${code} issued.\nSerials: ${serials.join(", ")}\nStock & FIFO cost updated.`);
  pageIssueBOM();
}

function renderBuildTable(){
  const bom = db.boms.find(b=>b.id===currentBuildBom);
  if(!bom) return;
  const units = Math.max(Number(document.getElementById("buildUnits").value)||0, 0);
  let allOk = true;
  const rows = bom.items.map(line=>{
    const item = db.items.find(i=>i.sku===line.sku);
    const need = line.qtyPerUnit * units;
    const have = item ? Number(item.qty) : 0;
    const ok = item && have >= need;
    if(!ok) allOk = false;
    return `<tr>
      <td>${esc(line.name)}</td>
      <td>${line.qtyPerUnit} ${esc(line.unit)}</td>
      <td><b>${need} ${esc(line.unit)}</b></td>
      <td>${have} ${esc(line.unit)}</td>
      <td>${ok ? '<span class="badge green">OK</span>' : '<span class="badge red">Short</span>'}</td>
    </tr>`;
  }).join("");
  document.getElementById("buildTableWrap").innerHTML = `
    <h3 style="margin-top:0;">Material for ${units} unit "${esc(bom.model)}"</h3>
    <div class="table-wrap"><table>
      <tr><th>Item</th><th>Per unit</th><th>Total needed</th><th>In stock</th><th>Status</th></tr>
      ${rows}
    </table></div>
    ${allOk
      ? '<p class="form-note" style="color:var(--green);">All material available - you can build.</p>'
      : '<p class="form-note" style="color:var(--red);">Red items are short - build is blocked until stock arrives.</p>'}
  `;
}

function doBuild(){
  const bom = db.boms.find(b=>b.id===currentBuildBom);
  if(!bom) return;
  const units = Number(document.getElementById("buildUnits").value);
  const err = document.getElementById("buildError");
  if(!units || units<=0){ err.textContent="Enter units 1 or more."; err.style.display="block"; return; }

  const shortages = [];
  bom.items.forEach(line=>{
    const item = db.items.find(i=>i.sku===line.sku);
    const need = line.qtyPerUnit * units;
    const have = item ? Number(item.qty) : 0;
    if(!item || have < need){
      shortages.push(`${line.name} - need ${need} ${line.unit||''}, only ${have} ${line.unit||''} in stock`);
    }
  });
  if(shortages.length){
    err.innerHTML = "These items are short on stock, so build isn't possible:<br>&bull; " + shortages.map(esc).join("<br>&bull; ");
    err.style.display = "block";
    return;
  }
  err.style.display = "none";

  bom.items.forEach(line=>{
    const item = db.items.find(i=>i.sku===line.sku);
    item.qty = Number(item.qty) - line.qtyPerUnit*units;
    db.transactions.push({
      type:"OUT", sku:line.sku, itemName:line.name, qty: line.qtyPerUnit*units,
      person:"Production", ref:`Build: ${bom.model} x${units}`,
      date:new Date().toLocaleDateString("en-IN")
    });
  });
  save();
  logAction(`Build: ${bom.model} x${units} - all material subtracted from stock`);
  alert(`${units} unit "${bom.model}" built. All material subtracted from stock.`);
  pageBOMBuild(currentBuildBom);
}

    startJobFromTemplateId = null;
  }
}

function applyBOMTemplate(){
  const id = document.getElementById("jobBomTemplate").value;
  if(!id) return;
  const t = db.bomTemplates.find(x=>x.id===id);
  if(!t) return;
  jobDraftItems = t.items.map(x=>({...x}));
  if(!document.getElementById("jobName").value.trim()){
    document.getElementById("jobName").value = t.name;
  }
  renderJobItemsTable();
}

function loadJobItems(){
  const cat = document.getElementById("jobCategory").value;
  const items = cat ? db.items.filter(it=>it.category===cat) : [];
  const sel = document.getElementById("jobItem");
  sel.innerHTML = items.length
    ? `<option value="">Select item</option>` + items.map(it=>
        `<option value="${it.sku}">${esc(it.sku)} - ${esc(it.name)} (free: ${availableQty(it)} ${it.unit}, total stock: ${it.qty})</option>`
      ).join("")
    : `<option value="">No item in this category</option>`;
}

function addJobItem(){
  const sku = document.getElementById("jobItem").value;
  const qty = Number(document.getElementById("jobQty").value);
  const err = document.getElementById("jobError");

  if(!sku || !qty || qty<=0){
    err.textContent = "Select item and valid quantity.";
    err.style.display = "block";
    return;
  }
  err.style.display = "none";

  const item = db.items.find(x=>x.sku===sku);
  if(jobDraftItems.find(x=>x.sku===sku)){
    err.textContent = "This item is already in the BOM.";
    err.style.display = "block";
    return;
  }

  const avail = availableQty(item);
  if(qty > avail){
    err.textContent = `Warning: only ${avail} ${item.unit} free (rest reserved for other jobs). Adding ${qty} anyway — it will be reserved when the job is created.`;
    err.style.display = "block";
  } else {
    err.style.display = "none";
  }

  jobDraftItems.push({ sku:item.sku, name:item.name, unit:item.unit, requiredQty:qty });
  document.getElementById("jobItem").value = "";
  document.getElementById("jobQty").value = "";
  renderJobItemsTable();
}

function removeJobItem(i){ jobDraftItems.splice(i,1); renderJobItemsTable(); }

function renderJobItemsTable(){
  const wrap = document.getElementById("jobItemsTable");
  if(!wrap) return;
  if(!jobDraftItems.length){
    wrap.innerHTML = `<p class="form-note">No items in BOM yet.</p>`;
    return;
  }
  wrap.innerHTML = `<div class="table-wrap"><table>
    <tr><th>Item</th><th>Unit</th><th>Required qty</th><th></th></tr>
    ${jobDraftItems.map((x,i)=>`<tr>
      <td>${esc(x.name)}</td><td>${esc(x.unit)}</td><td>${x.requiredQty}</td>
      <td><button class="btn" style="padding:4px 10px; font-size:12px; background:var(--red);" onclick="removeJobItem(${i})">Remove</button></td>
    </tr>`).join("")}
  </table></div>`;
}

function generateJobId(){
  const year = new Date().getFullYear();
  const count = db.jobs.filter(j=>j.id && j.id.startsWith("JOB-"+year+"-")).length;
  return "JOB-"+year+"-"+String(count+1).padStart(3,"0");
}

function createJob(){
  const name = document.getElementById("jobName").value.trim();
  const err = document.getElementById("jobError");

  if(!name){
    err.textContent = "Enter job/transformer name.";
    err.style.display = "block";
    return;
  }
  if(!jobDraftItems.length){
    err.textContent = "Add at least one item to BOM.";
    err.style.display = "block";
    return;
  }
  err.style.display = "none";

  const job = {
    id: generateJobId(),
    name,
    bom: jobDraftItems.slice(),
    date: new Date().toLocaleDateString("en-IN")
  };
  db.jobs.push(job);
  save();
  logAction(`Job created: ${job.id} - ${name} (${job.bom.length} items in BOM)`);
  pageJobs();
}

function issuedQtyForJobLine(job, line){
  return db.transactions
    .filter(t=>t.type==="OUT" && t.ref && t.ref.trim()===job.id && t.sku===line.sku)
    .reduce((a,t)=>a+Number(t.qty),0);
}

function jobProgress(job){
  const totalRequired = job.bom.reduce((a,l)=>a+l.requiredQty,0);
  const totalIssued = job.bom.reduce((a,l)=>a+Math.min(issuedQtyForJobLine(job,l), l.requiredQty),0);
  return { totalRequired, totalIssued, pending: totalRequired-totalIssued };
}

function jobListTable(){
  return `<div class="table-wrap"><table>
    <tr><th>Job ID</th><th>Name</th><th>Items in BOM</th><th>Progress</th><th>Date</th><th></th></tr>
    ${db.jobs.map(job=>{
      const p = jobProgress(job);
      const statusBadge = p.pending<=0 ? `<span class="badge green">Complete</span>` : p.totalIssued>0 ? `<span class="badge yellow">Partial</span>` : `<span class="badge red">Not started</span>`;
      return `<tr>
        <td>${esc(job.id)}</td><td>${esc(job.name)}</td><td>${job.bom.length}</td>
        <td>${p.totalIssued} / ${p.totalRequired} ${statusBadge}</td><td>${esc(job.date)}</td>
        <td style="display:flex; gap:6px;">
          <button class="btn" style="padding:6px 10px; font-size:12px;" onclick="pageJobDetail('${esc(job.id)}')">View / Issue material</button>
          ${p.pending>0 ? `<button class="btn" style="padding:6px 10px; font-size:12px; background:var(--yellow);" onclick="viewReservedForJob('${esc(job.id)}')">View reserved</button>` : ""}
        </td>
      </tr>`;
    }).join("")}
  </table></div>`;
}

}

function pageJobDetail(jobId){
  const job = db.jobs.find(j=>j.id===jobId);
  if(!job) return;

  document.getElementById("page").innerHTML = `
    <div class="breadcrumb"><span onclick="pageJobs()">Jobs</span> &rsaquo; ${esc(job.name)}</div>
    <div class="page-title">${esc(job.name)}</div>
    <div class="page-subtitle">Job ID: ${esc(job.id)} &middot; Date: ${esc(job.date)}</div>

    <div class="box" style="margin-top:0;">
      <h3>BOM - qty issued per item</h3>
      <div class="table-wrap"><table>
        <tr><th>Item</th><th>Required</th><th>Issued</th><th>Pending</th><th>Left in store</th><th>Status</th><th>Issue</th></tr>
        ${job.bom.map(line=>{
          const issued = Math.min(issuedQtyForJobLine(job,line), line.requiredQty);
          const pending = line.requiredQty - issued;
          const item = db.items.find(i=>i.sku===line.sku);
          const statusBadge = pending<=0 ? `<span class="badge green">Complete</span>` : issued>0 ? `<span class="badge yellow">Partial</span>` : `<span class="badge red">Pending</span>`;
          return `<tr>
            <td>${esc(line.name)}</td><td>${line.requiredQty} ${esc(line.unit)}</td><td>${issued} ${esc(line.unit)}</td>
            <td>${pending} ${esc(line.unit)}</td><td>${item ? item.qty : '-'} ${esc(line.unit)}</td>
            <td>${statusBadge}</td>
            <td>
              ${pending>0 ? `
                <input type="number" min="1" max="${pending}" id="jobIssueQty-${esc(line.sku)}" style="width:70px; padding:5px 8px; border:1px solid var(--line); border-radius:6px;" placeholder="Qty">
                <button class="btn" style="padding:5px 10px; font-size:12px;" onclick="issueForJob('${esc(job.id)}','${esc(line.sku)}')">Issue</button>
              ` : `<span class="form-note">Done</span>`}
            </td>
          </tr>`;
        }).join("")}
      </table></div>
    </div>
  `;
}

function issueForJob(jobId, sku){
  const job = db.jobs.find(j=>j.id===jobId);
  const line = job.bom.find(l=>l.sku===sku);
  const item = db.items.find(i=>i.sku===sku);
  const qtyInput = document.getElementById(`jobIssueQty-${sku}`);
  const qty = Number(qtyInput.value);

  if(!qty || qty<=0){ alert("Enter a valid quantity."); return; }

  const issuedSoFar = Math.min(issuedQtyForJobLine(job,line), line.requiredQty);
  const pending = line.requiredQty - issuedSoFar;
  if(qty > pending){ alert(`Only ${pending} ${line.unit} pending for this job.`); return; }
  if(qty > item.qty){ alert(`Only ${item.qty} ${item.unit} left in store.`); return; }

  item.qty = Number(item.qty) - qty;
  db.transactions.push({
    type:"OUT", sku:item.sku, itemName:item.name, qty, person:job.name, ref:job.id,
    date: new Date().toLocaleDateString("en-IN")
  });
  save();
  logAction(`Job ${job.id}: ${item.name} x ${qty} issued for ${job.name}`);
  pageJobDetail(jobId);
}

function reservedSummaryTable(){
  // Har item ka total reserved qty (sabhi jobs se milake), sirf jinka reserved > 0 hai
  const rows = db.items
    .map(it => ({ item: it, reserved: reservedQtyForItem(it.sku) }))
    .filter(r => r.reserved > 0);

  if(!rows.length) return `<p class="form-note">No material reserved for any job yet.</p>`;

  return `<div class="table-wrap"><table>
    <tr><th>Item</th><th>Category</th><th>Total stock</th><th>Reserved (jobs)</th><th>Available</th></tr>
    ${rows.map(r=>`<tr>
      <td>${esc(r.item.name)}</td><td>${esc(r.item.category)}</td><td>${r.item.qty} ${esc(r.item.unit)}</td>
      <td><span class="badge yellow">${r.reserved} ${esc(r.item.unit)}</span></td>
      <td>${availableQty(r.item)} ${esc(r.item.unit)}</td>
    </tr>`).join("")}
  </table></div>`;
}

function reservedJobsTable(){
  // Sirf wo jobs jinme kuch pending (reserved) hai
  const activeJobs = db.jobs.filter(job => jobProgress(job).pending > 0);

  if(!activeJobs.length) return `<p class="form-note">No active reservations - all job material issued.</p>`;

  return activeJobs.map(job=>{
    const p = jobProgress(job);
    const pendingLines = job.bom.filter(line=>{
      const issued = Math.min(issuedQtyForJobLine(job,line), line.requiredQty);
      return (line.requiredQty - issued) > 0;
    });

    return `<div class="box" id="resjob-${esc(job.id)}" style="margin-top:0; margin-bottom:16px; transition:box-shadow 0.3s;">
      <h3>${esc(job.name)} <span class="form-note" style="font-weight:400;">(${esc(job.id)} &middot; kul pending ${p.pending} units)</span>
        <button class="btn" style="padding:5px 10px; font-size:12px; margin-left:10px;" onclick="pageJobDetail('${esc(job.id)}')">Job kholo</button>
      </h3>
      <div class="table-wrap"><table>
        <tr><th>Item</th><th>Required</th><th>Issued</th><th>Reserved (pending)</th></tr>
        ${pendingLines.map(line=>{
          const issued = Math.min(issuedQtyForJobLine(job,line), line.requiredQty);
          const pending = line.requiredQty - issued;
          return `<tr><td>${esc(line.name)}</td><td>${line.requiredQty} ${esc(line.unit)}</td><td>${issued} ${esc(line.unit)}</td>
            <td><span class="badge yellow">${pending} ${esc(line.unit)}</span></td></tr>`;
        }).join("")}
      </table></div>
    </div>`;
  }).join("");
}

function prefillPORate(){
  const sku = document.getElementById("poItem").value;
  const item = db.items.find(x=>x.sku===sku);
  if(!item) return;

  const rateInput = document.getElementById("poRate");
  const noteEl = document.getElementById("poRateNote");
  rateInput.value = item.rate || 0;
  if(noteEl) noteEl.textContent = "";

  if(db.categorySheetLinks[item.category]){
    if(noteEl) noteEl.textContent = "Fetching rate from sheet...";
    fetchRateFromSheet(item.sku, item.category).then(liveRate=>{
      if(liveRate !== null){
        rateInput.value = liveRate;
        item.rate = liveRate; // item master mein bhi update kar do
        save();
        if(noteEl) noteEl.textContent = "✓ Rate " + inr(liveRate) + " fetched live from this item's Google Sheet (" + item.category + ").";
      } else {
        if(noteEl) noteEl.textContent = "No rate from sheet; using item master rate.";
      }
    });
  }
}

  if(!sku || !qty || qty<=0 || rate<0){
    err.textContent = "Item, valid quantity and rate required.";
    err.style.display = "block";
    return;

  err.style.display = "none";

  const item = db.items.find(x=>x.sku===sku);
  poDraftItems.push({ sku:item.sku, name:item.name, unit:item.unit, qty, rate, amount:qty*rate });

  document.getElementById("poItem").value = "";

function generatePONumber(){
  const year = new Date().getFullYear();
  const countThisYear = db.purchaseOrders.filter(p=>p.id && p.id.startsWith("PO-"+year+"-")).length;
  return "PO-"+year+"-"+String(countThisYear+1).padStart(3,"0");
}

function generatePurchaseOrder(){
  const vendorName = document.getElementById("poVendor").value;
  const err = document.getElementById("poError");

  if(!vendorName){
    err.textContent = "Select vendor.";
    err.style.display = "block";
    return;
  }
  if(!poDraftItems.length){
    err.textContent = "Add at least one item.";
    err.style.display = "block";
    return;
  }
  err.style.display = "none";

  const v = db.vendors.find(x=>x.name===vendorName);
  const subtotal = poDraftItems.reduce((a,x)=>a+x.amount,0);
  const gstPercent = Number(document.getElementById("poGstPercent")?.value || 0);
  const gstAmount = Number((subtotal * gstPercent / 100).toFixed(2));
  const grandTotal = Number((subtotal + gstAmount).toFixed(2));

  const po = {
    id: generatePONumber(),
    vendor: vendorName,
    vendorDetails: v ? {name:v.name, contact:v.contact||"", address:v.address||"", gst:v.gst||""} : {name:vendorName, contact:"", address:"", gst:""},
    items: poDraftItems.slice(),
    subtotal, gstPercent, gstAmount, grandTotal,
    date: new Date().toLocaleDateString("en-IN"),
    status: "PENDING"
  };
  db.purchaseOrders.push(po);
  save();
  logAction(`Purchase Order ${po.id} generated for vendor ${po.vendor}, grand total ${inr(po.grandTotal)}`);
  pagePO();
}

function receivedQtyForLine(po, line){
  return db.transactions
    .filter(t=>t.type==="IN" && t.status==="Accepted" && t.ref && t.ref.trim()===po.id && t.sku===line.sku)
    .reduce((a,t)=>a+Number(t.qty),0);
}

function pagePODetail(id){
  const po = db.purchaseOrders.find(p=>p.id===id);
  if(!po){ pagePO(); return; }
  buildMenu("po");
  document.getElementById("topbarTitle").textContent = "Purchase Orders";

  let totOrdered=0, totReceived=0, totRemaining=0;

  const rows = po.items.map(line=>{
    const item = db.items.find(i=>i.sku===line.sku) || {};
    const unit = line.unit || item.unit || "";
    const receivedAll = receivedQtyForLine(po, line);
    const remaining = Math.max(Number(line.qty) - receivedAll, 0);
    totOrdered += Number(line.qty);
    totReceived += receivedAll;
    totRemaining += remaining;

    const dl = (item.avgDailyConsumption && item.avgDailyConsumption>0)
      ? Math.round((Number(item.qty)||0)/item.avgDailyConsumption) : null;

    return `<tr>
      <td>${esc(line.name)}</td>

      <td><b>${line.qty} ${esc(unit)}</b></td>
      <td>${receivedAll} ${esc(unit)}</td>
      <td>${remaining>0 ? `<span class="badge yellow">${remaining} ${esc(unit)}</span>` : `<span class="badge green">Fully received</span>`}</td>
      <td>${item.qty!==undefined ? item.qty+' '+esc(unit) : '-'}</td>
      <td>${item.min!==undefined ? item.min : '-'}</td>
      <td>${item.max!==undefined ? item.max : '-'}</td>
      <td>${item.avgDailyConsumption||0}</td>
      <td>${dl===null ? '-' : dl+' days'}</td>
      <td>${remaining>0 ? `
        <div style="display:flex; gap:6px; align-items:center;">
          <input id="rcv_${esc(line.sku)}" type="number" min="1" placeholder="Received qty"
            style="width:100px; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font-size:13px;">
          <button class="btn" style="padding:6px 10px; font-size:12px;" onclick="receivePOLine('${esc(po.id)}','${esc(line.sku)}')">Add to stock</button>

    </tr>`;
  }).join("");

  const poComplete = totRemaining<=0;

  document.getElementById("page").innerHTML = `
    <div class="breadcrumb"><span onclick="pagePO()">Purchase orders</span> &rsaquo; ${esc(po.id)}</div>
    <div class="page-title">${esc(po.id)} - tracking</div>
    <div class="page-subtitle">Vendor: ${esc(po.vendor)} &nbsp;|&nbsp; Date: ${esc(po.date)} &nbsp;|&nbsp; Status: ${poComplete ? '<span class="badge green">Complete</span>' : (totReceived>0 ? '<span class="badge yellow">Partial</span>' : '<span class="badge red">Pending</span>')}</div>

    <div class="box" style="margin-top:0;">
      <h3>Order vs Received vs Remaining</h3>
      <p class="form-note">Enter the received qty in "Received qty" and press "Add to stock" - it's added to stock instantly and remaining reduces automatically.</p>
      <div class="table-wrap"><table>
        <tr>
          <th>Item</th><th>Category</th>
          <th>Ordered</th><th>Received</th><th>Remaining</th>
          <th>Total stock</th><th>Min</th><th>Max</th><th>Daily use</th><th>Days left</th>
          <th>Received? (add)</th>
        </tr>
        ${rows}
        <tr style="background:rgba(255,255,255,.04); font-weight:700;">
          <td colspan="2">TOTAL</td>
          <td>${totOrdered}</td><td>${totReceived}</td><td>${totRemaining}</td>
          <td colspan="6"></td>

      <h3>Is PO ke against receiving history</h3>
      ${(() => {
        const hist = db.transactions.filter(t=>t.type==="IN" && t.status==="Accepted" && t.ref && t.ref.trim()===po.id).slice().reverse();
        if(!hist.length) return `<p class="form-note">No goods received against this PO yet.</p>`;

function receivePOLine(poId, sku){
  const po = db.purchaseOrders.find(p=>p.id===poId);
  if(!po) return;
  const line = po.items.find(l=>l.sku===sku);
  if(!line) return;

  const inp = document.getElementById("rcv_"+sku);
  const qty = Number(inp && inp.value);
  if(!qty || qty<=0){ alert("Enter how much quantity arrived first."); return; }

  const receivedAll = receivedQtyForLine(po, line);
  const remaining = Math.max(Number(line.qty) - receivedAll, 0);
  if(qty > remaining){
    const ok = confirm(`Only ${remaining} ${line.unit||''} was remaining, you're receiving ${qty}. Add to stock anyway?`);
    if(!ok) return;
  }

  const item = db.items.find(i=>i.sku===sku);
  if(item) item.qty = Number(item.qty) + qty;
  addLot(sku, qty, line.rate, po.id);   // FIFO lot with PO rate + PO no as invoice

  db.transactions.push({
    type:"IN", sku, itemName: line.name, qty,
    person:"PO receive", ref: po.id, invoice: po.id, rate: line.rate, status:"Accepted",
    date: new Date().toLocaleDateString("en-IN")
  });

  const stillPending = po.items.reduce((a,l)=>a+Math.max(Number(l.qty)-receivedQtyForLine(po,l),0),0);
  po.status = stillPending<=0 ? "RECEIVED" : "PARTIAL";

  save();
  logAction(`PO ${po.id}: received ${qty} of ${line.name}, added to stock`);
  pagePODetail(poId);
}

/* Outward quantity ko live stock se compare karo. Save par bhi hard validation rahegi. */
function validateOutwardQtyLive(){
  const qtyEl = document.getElementById("outQty");
  const itemEl = document.getElementById("outItem");
  const err = document.getElementById("outError");
  if(!qtyEl || !itemEl || !err) return true;

  const sku = itemEl.value;
  const qty = Number(qtyEl.value);
  const item = db.items.find(i=>i.sku===sku);

  if(!item || !qty) {
    if(!qty || qty<=0) err.style.display = "none";
    return true;
  }

  if(qty > Number(item.qty)){
    err.innerHTML = `⚠️ <b>${esc(item.name)}</b>: Available quantity is <b>${item.qty} ${esc(item.unit)}</b>, but you are issuing <b>${qty} ${esc(item.unit)}</b>. This quantity cannot be saved.`;
    err.style.display = "block";
    return false;
  }

  err.style.display = "none";
  return true;
}

function saveOutward(){
  const sku = document.getElementById("outItem").value;
  const qty = Number(document.getElementById("outQty").value);
  const person = document.getElementById("outPerson").value.trim();
  const ref = document.getElementById("outRef").value.trim();
  const receiver = (document.getElementById("outReceiver")||{value:""}).value.trim();
  const receipt = document.getElementById("outReceipt").value.trim();
  const serial = document.getElementById("outSerial").value;
  let job = document.getElementById("outJob").value.trim();
  const err = document.getElementById("outError");

  if(!sku || !qty || qty<=0 || !person){
    err.textContent = "Category, item, quantity and name required.";
    err.style.display = "block";
    return;
  }

  const item = db.items.find(i=>i.sku===sku);
  if(!item){
    err.textContent = "Selected item not found in stock.";
    err.style.display = "block";
    return;
  }
  if(!validateOutwardQtyLive()) return;
  err.style.display = "none";

  if(serial && !job) job = serial;
  const cost = consumeFIFO(sku, qty).cost;   // FIFO cost
  item.qty = Number(item.qty) - qty;

  db.transactions.push({
    type:"OUT", sku, itemName:item.name, qty, person, receivedBy:receiver, ref, job, receipt,
    tfpSerial: serial || "", cost,
    date: new Date().toLocaleDateString("en-IN")
  });
  save();
  logAction(`Outward entry: ${item.name} x ${qty} by ${person}${serial?` (TFP ${serial})`:(job?` (Job ${job})`:'')}`);
  pageOutward();
}

function historyTable(type){
  const rows = [];
  const useOutwardFilter = type==="OUT" && (outwardFromDate || outwardToDate);
  const from = outwardFromDate ? new Date(outwardFromDate+"T00:00:00") : null;
  const to = outwardToDate ? new Date(outwardToDate+"T23:59:59") : null;

  db.transactions.forEach((t,idx)=>{
    if(t.type!==type) return;
    if(useOutwardFilter){
      const d = parseINDate(t.date);
      if(!d) return;
      if(from && d < from) return;
      if(to && d > to) return;
    }
    rows.push({t, idx});
  });
  rows.reverse();
  if(!rows.length) return `<p class="form-note">No entries yet.</p>`;
  const jobCol = type==='OUT';
  return `<div class="table-wrap"><table>
    <tr><th>SKU</th><th>Item</th><th>Qty</th><th>${type==='IN'?'Received by':'Issued by'}</th>${jobCol?'<th>Requested by</th><th>Job No</th><th>Receipt No</th>':''}<th>Reference</th><th>Date</th>${jobCol?'<th>Return</th>':'<th>Edit</th>'}</tr>
    ${rows.map(({t,idx})=>{
      const ret = Number(t.returned||0);
      const canReturn = Number(t.qty) - ret;
      return `<tr>
        <td>${esc(t.sku||'-')}</td>
        <td>${esc(t.itemName)}</td>
        <td>${t.qty}${ret>0?` <span class="badge green">${ret} back</span>`:''}</td>
        <td>${esc(t.person)}</td>
        ${jobCol?`<td>${esc(t.receivedBy||'-')}</td><td>${esc(t.job||'-')}</td><td>${esc(t.receipt||'-')}</td>`:''}
        <td>${esc(t.ref||'-')}</td>
        <td>${esc(t.date)}</td>
        ${jobCol?`<td>${canReturn>0
            ? `<button class="btn" style="padding:5px 14px; font-size:12px; background:linear-gradient(135deg,#2F9E5B,#1F7D45); border-color:rgba(255,255,255,.22); color:#fff; cursor:pointer;" onclick="returnIssuedItem(${idx})">&#8630; Return</button>`
            : '<span class="badge green">full back</span>'}</td>`
          :`<td><button class="btn" style="padding:5px 12px; font-size:12px; background:rgba(255,255,255,.08);" onclick="editInwardModal(${idx})">Edit</button></td>`}
      </tr>`;
    }).join("")}
  </table></div>`;
}

function saveInwardEdit(idx){
  const t=db.transactions[idx]; if(!t||t.type!=="IN") return;
  const err=document.getElementById("edInErr");
  const newQty=Number(document.getElementById("edInQty").value);
  const newRate=Number(document.getElementById("edInRate").value);
  if(isNaN(newQty)||newQty<0){ err.textContent="Enter a valid quantity."; err.style.display="block"; return; }
  const item=db.items.find(i=>i.sku===t.sku);
  const oldQty=Number(t.qty);
  // stock adjust only for accepted inwards (hold/rejected didn't add to stock)
  if(item && (t.status==="Accepted" || !t.status)){
    item.qty = Math.max(0, Number(item.qty) + (newQty - oldQty));
  }
  // adjust matching FIFO lot if present (same sku + invoice)
  if(db.lots){
    const lot = db.lots.find(l=>l.sku===t.sku && (l.invoiceNo===(t.invoice||"")) && Number(l.qty)===oldQty);
    if(lot){ const consumed=Number(lot.qty)-Number(lot.remaining); lot.qty=newQty; lot.remaining=Math.max(0,newQty-consumed); lot.rate=newRate; }
  }
  t.qty=newQty; t.rate=newRate;
  t.invoice=document.getElementById("edInInv").value.trim();
  t.person=document.getElementById("edInPerson").value.trim();
  t.ref=document.getElementById("edInRef").value.trim();
  t.date=document.getElementById("edInDate").value.trim();
  save();
  logAction(`Inward edited: ${t.sku} qty ${oldQty}→${newQty}`);
  const m=document.getElementById("editInModal"); if(m) m.remove();
  const ih=document.getElementById("inwardHistory"); if(ih) ih.innerHTML=historyTable("IN");
  if(typeof refreshAlertBadge==="function") refreshAlertBadge();
}

/* Wapas aaya maal stock me add karo (usi rate pe, taaki FIFO cost sahi rahe) */
function returnIssuedItem(idx){
  const t = db.transactions[idx];
  if(!t || t.type!=="OUT") return;
  const already = Number(t.returned||0);
  const maxRet = Number(t.qty) - already;

  closeReturnModal();
  const overlay = document.createElement("div");
  overlay.className = "modal-overlay";
  overlay.id = "returnModal";

function closeReturnModal(){ const m=document.getElementById("returnModal"); if(m) m.remove(); }

function confirmReturn(idx){
  const t = db.transactions[idx];
  if(!t) return;
  const already = Number(t.returned||0);
  const maxRet = Number(t.qty) - already;
  const item = db.items.find(i=>i.sku===t.sku);
  const unit = item?item.unit:'';
  const q = Number(document.getElementById("returnQtyInput").value);
  const err = document.getElementById("returnErr");
  if(!q || q<=0 || q>maxRet){ err.textContent = `Enter a number between 1 and ${maxRet}.`; err.style.display="block"; return; }

  const rate = (t.cost && Number(t.qty)>0) ? (Number(t.cost)/Number(t.qty)) : (item?Number(item.rate):0);
  if(item) item.qty = Number(item.qty) + q;
  addLot(t.sku, q, rate, "RETURN");            // wapas aaya maal usi rate pe FIFO me
  t.returned = already + q;
  db.transactions.push({
    type:"IN", status:"Accepted", sku:t.sku, itemName:t.itemName, qty:q,
    person:"Return to stock", ref:"Return of "+(t.job||t.ref||t.itemName), receipt:t.receipt||"", rate,
    date:new Date().toLocaleDateString("en-IN")
  });
  save();
  logAction(`Return: ${t.itemName} x ${q} ${unit} back to stock (issue ref ${t.job||t.ref||'-'})`);
  closeReturnModal();
  const box = document.getElementById("outwardHistory");
  if(box) box.innerHTML = historyTable("OUT");
}

/* Total ordered for an item (across all purchase orders) */
function orderedQtyForSku(sku){
  let t = 0;
  db.purchaseOrders.forEach(po=>{
    po.items.forEach(line=>{ if(line.sku===sku) t += Number(line.qty); });
  });
  return t;
}
/* Total received for an item (capped at ordered per PO line) */
function poReceivedQtyForSku(sku){
  let t = 0;
  db.purchaseOrders.forEach(po=>{
    po.items.forEach(line=>{
      if(line.sku===sku) t += Math.min(receivedQtyForLine(po, line), Number(line.qty));
    });
  });
  return t;
}

/* Parse "DD/MM/YYYY" (en-IN) date to a Date object */
function parseINDate(s){
  if(!s) return null;
  const p = String(s).split("/");
  if(p.length===3) return new Date(Number(p[2]), Number(p[1])-1, Number(p[0]));
  const d = new Date(s); return isNaN(d) ? null : d;
}

/* Closing stock as at a cutoff = current qty rolled back over later transactions */
function closingQtyAsOf(item, cutoff){
  let q = Number(item.qty);
  db.transactions.forEach(t=>{
    if(t.sku!==item.sku) return;
    const d = parseINDate(t.date);
    if(!d || d<=cutoff) return;            // only undo transactions AFTER the cutoff
    if(t.type==="IN" && t.status==="Accepted") q -= Number(t.qty);
    else if(t.type==="OUT") q += Number(t.qty);
  });
  return q;
}

/* Sum of monthly transactions for an item within [start, end] */
function txnSumInPeriod(sku, start, end, type, acceptedOnly){
  let s = 0;
  db.transactions.forEach(t=>{
    if(t.sku!==sku || t.type!==type) return;
    if(acceptedOnly && !(t.type!=="IN" || t.status==="Accepted")) return;
    const d = parseINDate(t.date);
    if(!d || d<start || d>end) return;
    s += Number(t.qty);
  });
  return s;
}

  let tOpen=0, tIn=0, tOut=0, tClose=0, tVal=0, rows="";

/* ===================== PURCHASE ORDER COMPARISON (month vs previous month) ===================== */
function posInDateRange(start, end){
  return db.purchaseOrders.filter(po=>{
    const d = parseINDate(po.date);
    return d && d>=start && d<=end;
  });
}

function poPeriodSummary(list){
  const totalQty = list.reduce((a,po)=>a+po.items.reduce((s,x)=>s+Number(x.qty),0), 0);
  const totalValue = list.reduce((a,po)=>a+Number(po.grandTotal||0), 0);
  return { count:list.length, totalQty, totalValue };
}

function poPctChange(curV, prevV){
  if(prevV===0) return curV===0 ? "0%" : "+100%";
  const pct = ((curV-prevV)/prevV*100);
  return (pct>=0?"+":"") + pct.toFixed(1) + "%";
}

function poItemQtyMap(list){
  const map = {};
  list.forEach(po=>po.items.forEach(x=>{ map[x.sku] = (map[x.sku]||0) + Number(x.qty); }));
  return map;
}

  // Combined report: har category apna alag block, subtotal ke saath
  return CATEGORIES.map(c=>{
    const items = db.items.filter(it=>it.category===c);
    if(!items.length) return "";
    const totalQty = items.reduce((a,x)=>a+Number(x.qty),0);
    const totalValue = items.reduce((a,x)=>a+Number(x.qty)*Number(x.rate),0);
    return `<div class="box" style="margin-top:16px;">
      <h3>${esc(c)} <span class="form-note" style="font-weight:400;">(${items.length} item${items.length===1?'':'s'}, total qty ${totalQty}, total value ${inr(totalValue)})</span></h3>
      ${reportItemsTable(items)}
    </div>`;
  }).join("");
}
