/* ===================== DELIVERY SCHEDULE & MATERIAL PLANNING ===================== */
function monthKeyFromInput(v){ return /^\d{4}-\d{2}$/.test(v||'') ? v : new Date().toISOString().slice(0,7); }
function monthLabel(k){ const d=new Date(k+"-01T00:00:00"); return d.toLocaleDateString("en-IN",{month:"long",year:"numeric"}); }
function deliveryRowsSorted(){ return db.deliverySchedule.slice().sort((a,b)=>a.month.localeCompare(b.month)); }
function monthRequirements(month){
  const req={};
  db.deliverySchedule.filter(r=>r.month===month).forEach(r=>{
    const m=db.models.find(x=>x.code===r.model); if(!m) return;
    (m.lines||[]).forEach(l=>req[l.sku]=(req[l.sku]||0)+Number(l.qty||0)*Number(r.units||0));
  }); return req;
}
function scheduleItemStatus(it, month){
  const all=deliveryRowsSorted().filter(r=>r.month<=month);
  let before=0, current=0;
  all.forEach(r=>{ const m=db.models.find(x=>x.code===r.model); if(!m)return; const q=(m.lines||[]).filter(l=>l.sku===it.sku).reduce((a,l)=>a+Number(l.qty||0)*Number(r.units||0),0); if(r.month<month)before+=q; else current+=q; });
  const projected=Number(it.qty||0)-before-current;
  const totalNeed=before+current;
  const onOrder=Math.max((typeof orderedQtyForSku==='function'?orderedQtyForSku(it.sku):0)-(typeof poReceivedQtyForSku==='function'?poReceivedQtyForSku(it.sku):0),0);
  const daysToMonth=Math.max(0,Math.ceil((new Date(month+"-01")-new Date())/86400000));
  const lt=Number(it.leadTimeDays||0);
  let zone='green', text='Ready';
  if(projected<0){ zone='red'; text='Short - order now'; }
  else if(projected < Number(it.max||0)*0.33){ zone='yellow'; text='Low for scheduled jobs'; }
  if(projected<0 && daysToMonth<lt) text='CRITICAL: lead time miss risk';
  const orderQty=Math.max(0, Math.ceil(Number(it.max||0)-projected-onOrder));
  return {before,current,projected,onOrder,daysToMonth,lt,zone,text,orderQty,totalNeed};
}
function addDeliverySchedule(){
  const month=monthKeyFromInput(document.getElementById('dsMonth').value);
  const model=document.getElementById('dsModel').value;
  const units=Number(document.getElementById('dsUnits').value);
  const err=document.getElementById('dsError');
  if(!model||!units||units<=0){err.textContent='Month, model and transformer quantity are required.';err.style.display='block';return;}
  const existing=db.deliverySchedule.find(r=>r.month===month&&r.model===model);
  if(existing) existing.units+=units; else db.deliverySchedule.push({id:'DS-'+Date.now(),month,model,units});
  save(); logAction(`Delivery schedule added: ${month} ${model} x${units}`); pageDeliverySchedule();
}
function deleteDeliverySchedule(id){ db.deliverySchedule=db.deliverySchedule.filter(r=>r.id!==id); save(); pageDeliverySchedule(); }

function advanceScheduleAlerts(){
  const today = new Date(); today.setHours(0,0,0,0);
  const alerts=[];
  const safetyBufferDays = 7;
  const seen=new Set();
  [...new Set(deliveryRowsSorted().map(r=>r.month))].forEach(month=>{
    const [yy,mm]=month.split('-').map(Number);
    const requiredDate=new Date(yy,mm-1,1);
    const req=monthRequirements(month);
    Object.keys(req).forEach(sku=>{
      const it=db.items.find(x=>x.sku===sku);
      if(!it || !req[sku]) return;
      const st=scheduleItemStatus(it,month);
      const shortage=Math.max(0, Number(st.orderQty||0));
      if(shortage<=0) return;
      const lt=Math.max(0, Number(it.leadTimeDays||0));
      const orderBy=new Date(requiredDate);
      orderBy.setDate(orderBy.getDate()-lt-safetyBufferDays);
      const warningStart=new Date(requiredDate);
      warningStart.setDate(warningStart.getDate()-lt-safetyBufferDays);
      const daysToOrder=Math.ceil((orderBy-today)/86400000);
      const daysToDelivery=Math.ceil((requiredDate-today)/86400000);
      if(daysToDelivery<0) return;
      const key=month+'|'+sku;
      if(seen.has(key)) return;
      seen.add(key);
      let status='future';
      if(daysToOrder<=0) status='red';
      else if(daysToOrder<=30) status='yellow';
      alerts.push({ it,month,need:req[sku],s:st,lt,orderBy,warningStart,daysToOrder,daysToDelivery,status,safetyBufferDays });
    });
  });
  return alerts.sort((a,b)=>a.orderBy-b.orderBy);
}

function normStr(s){ return String(s==null?"":s).toLowerCase().replace(/\s+/g," ").trim(); }

/* ---- ITEM duplicates (same name, different SKU) ---- */
function findItemDuplicates(){
  const map = {};
  db.items.forEach(it=>{ const k=normStr(it.name); if(!k) return; (map[k]=map[k]||[]).push(it); });
  return Object.values(map).filter(g=>g.length>1);
}
function openItemDupModal(){
  const groups = findItemDuplicates();
  const ov = document.createElement("div");
  ov.className="modal-overlay"; ov.id="dupModal"; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  const body = !groups.length
    ? `<p class="form-note">✅ No duplicate items found (no two SKUs share the same name).</p>`
    : groups.map((g,gi)=>{
        const opts = g.map(it=>`<option value="${esc(it.sku)}">${esc(it.sku)} (stock ${it.qty} ${esc(it.unit)})</option>`).join("");
        return `<div class="box" style="margin:0 0 12px; border-left:4px solid var(--yellow);">
          <h4 style="margin:0 0 6px;">"${esc(g[0].name)}" — ${g.length} SKUs</h4>
          <div class="table-wrap"><table>
            <tr><th>SKU</th><th>Category</th><th>Stock</th><th>Rate</th><th>Max</th></tr>
            ${g.map(it=>`<tr><td>${esc(it.sku)}</td><td>${esc(it.category)}</td><td>${it.qty} ${esc(it.unit)}</td><td>${inr(it.rate)}</td><td>${it.max}</td></tr>`).join("")}
          </table></div>
          <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-top:10px;">
            <div class="form-group" style="margin:0;"><label>Keep this SKU (merge others into it)</label>
              <select id="dupKeep_${gi}">${opts}</select></div>
            <button class="btn" onclick="mergeItemGroup(${gi})">Merge into kept SKU</button>
            <span class="form-note">Stock + history + BOM of the others move into the kept SKU; the rest are removed.</span>
          </div>
        </div>`;
      }).join("");
  ov.innerHTML = `<div class="modal-box" style="width:760px; max-width:96vw;">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="margin:0;">Possible duplicate items</h3>
      <button class="btn" onclick="this.closest('.modal-overlay').remove()">Close</button></div>
    <p class="form-note" style="margin:8px 0 14px;">Items with the <b>same name but different SKU</b>. Merge the ones created by mistake; keep the ones that are genuinely different (rename them to avoid confusion).</p>
    ${body}
  </div>`;
  document.body.appendChild(ov);
}
function mergeItemGroup(gi){
  const groups = findItemDuplicates();
  const g = groups[gi]; if(!g) return;
  const keepSku = document.getElementById("dupKeep_"+gi).value;
  const drops = g.filter(it=>it.sku!==keepSku).map(it=>it.sku);
  if(!drops.length) return;
  if(!confirm(`Merge ${drops.length} SKU(s) into ${keepSku}?\nTheir stock and history will move into ${keepSku}, and they will be removed.`)) return;
  drops.forEach(dropSku=>mergeItems(keepSku, dropSku));
  openItemDupModal();  // refresh
  const tw=document.getElementById("itemTableWrap"); if(tw) tw.innerHTML=itemsTable(db.items);
}
function mergeItems(keepSku, dropSku){
  if(keepSku===dropSku) return;
  const keep = db.items.find(i=>i.sku===keepSku), drop = db.items.find(i=>i.sku===dropSku);
  if(!keep||!drop) return;
  keep.qty = Number(keep.qty||0) + Number(drop.qty||0);
  keep.openingStock = Number(keep.openingStock||0) + Number(drop.openingStock||0);
  db.transactions.forEach(t=>{ if(t.sku===dropSku){ t.sku=keepSku; t.itemName=keep.name; } });
  if(db.lots) db.lots.forEach(l=>{ if(l.sku===dropSku) l.sku=keepSku; });
  (db.models||[]).forEach(m=>{
    (m.lines||[]).forEach(l=>{ if(l.sku===dropSku) l.sku=keepSku; });
    // combine duplicate BOM lines
    const seen={}; m.lines=(m.lines||[]).filter(l=>{ if(seen[l.sku]){ seen[l.sku].qty=Number(seen[l.sku].qty||0)+Number(l.qty||0); return false;} seen[l.sku]=l; return true; });
  });
  (db.indents||[]).forEach(ind=>{ (ind.lines||[]).forEach(l=>{ if(l.sku===dropSku){ l.sku=keepSku; l.name=keep.name; } }); });
  db.items = db.items.filter(i=>i.sku!==dropSku);
  save();
  logAction(`Merged item ${dropSku} into ${keepSku}`);
}

/* ---- VENDOR duplicates (same name or same GST) ---- */
function findVendorDuplicates(){
  const map={};
  db.vendors.forEach(v=>{
    const kName=normStr(v.name), kGst=normStr(v.gst);
    const key = kGst ? "gst:"+kGst : "name:"+kName;
    (map[key]=map[key]||[]).push(v);
    if(kGst){ const nk="name:"+kName; /* also group by name if gst missing elsewhere */ }
  });
  // also merge groups that share name
  return Object.values(map).filter(g=>g.length>1);
}
function openVendorDupModal(){
  const groups = findVendorDuplicates();
  const ov=document.createElement("div");
  ov.className="modal-overlay"; ov.onclick=e=>{ if(e.target===ov) ov.remove(); };
  const body = !groups.length
    ? `<p class="form-note">✅ No duplicate vendors found.</p>`
    : groups.map((g,gi)=>{
        const opts=g.map(v=>`<option value="${esc(v.name)}">${esc(v.name)}${v.gst?` (GST ${esc(v.gst)})`:''}</option>`).join("");
        return `<div class="box" style="margin:0 0 12px; border-left:4px solid var(--yellow);">
          <h4 style="margin:0 0 6px;">${g.length} matching vendors</h4>
          <div class="table-wrap"><table><tr><th>Name</th><th>Contact</th><th>Address</th><th>GST</th></tr>
          ${g.map(v=>`<tr><td>${esc(v.name)}</td><td>${esc(v.contact||'-')}</td><td>${esc(v.address||'-')}</td><td>${esc(v.gst||'-')}</td></tr>`).join("")}</table></div>
          <div style="display:flex; gap:8px; align-items:flex-end; flex-wrap:wrap; margin-top:10px;">
            <div class="form-group" style="margin:0;"><label>Keep this vendor</label><select id="vdupKeep_${gi}">${opts}</select></div>
            <button class="btn" onclick="mergeVendorGroup(${gi})">Merge duplicates</button>
          </div>
        </div>`;
      }).join("");
  ov.innerHTML=`<div class="modal-box" style="width:720px; max-width:96vw;">
    <div style="display:flex; justify-content:space-between; align-items:center;"><h3 style="margin:0;">Possible duplicate vendors</h3>
    <button class="btn" onclick="this.closest('.modal-overlay').remove()">Close</button></div>
    <p class="form-note" style="margin:8px 0 14px;">Vendors with the <b>same name or same GST</b>. Merging keeps one and points existing POs to it.</p>${body}</div>`;
  document.body.appendChild(ov);
}
function mergeVendorGroup(gi){
  const groups=findVendorDuplicates(); const g=groups[gi]; if(!g) return;
  const keepName=document.getElementById("vdupKeep_"+gi).value;
  const keepObj = g.find(v=>v.name===keepName) || g[0];
  const drops = g.filter(v=>v!==keepObj);   // reference se, taaki same-naam bhi hate
  if(!drops.length) return;
  if(!confirm(`Merge ${drops.length} vendor(s) into "${keepName}"?`)) return;
  drops.forEach(d=>{
    (db.purchaseOrders||[]).forEach(po=>{ if(po.vendor===d.name) po.vendor=keepName; });
    // keep any missing detail from the dropped record
    if(!keepObj.contact && d.contact) keepObj.contact=d.contact;
    if(!keepObj.address && d.address) keepObj.address=d.address;
    if(!keepObj.gst && d.gst) keepObj.gst=d.gst;
    db.vendors = db.vendors.filter(v=>v!==d);
  });
  save(); logAction(`Merged ${drops.length} vendor(s) into ${keepName}`);
  const m=document.querySelector('.modal-overlay'); if(m) m.remove();
  openVendorDupModal();
  if(document.querySelector('.page-title') && document.querySelector('.page-title').innerText.includes('Vendors')) pageVendors();
}

/* ============================================================
   GOOGLE SHEET / CSV IMPORT for Item Master
   ============================================================ */
function toggleCsvPaste(){ const w=document.getElementById("csvPasteWrap"); if(w) w.style.display = w.style.display==="none"?"block":"none"; }
function importMsg(html, ok){ const m=document.getElementById("importMsg"); if(m) m.innerHTML=`<div class="box" style="margin:0; border-left:4px solid ${ok?'var(--green)':'var(--red)'}; padding:10px 14px;">${html}</div>`; }

function parseCSV(text){
  const rows=[]; let row=[], cur="", q=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){
      if(c==='"'){ if(text[i+1]==='"'){ cur+='"'; i++; } else q=false; }
      else cur+=c;
    } else {
      if(c==='"') q=true;
      else if(c===","){ row.push(cur); cur=""; }
      else if(c==="\n"){ row.push(cur); rows.push(row); row=[]; cur=""; }
      else if(c==="\r"){}
      else cur+=c;
    }
  }
  if(cur!==""||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(r=>r.some(x=>String(x).trim()!==""));
}

function mapHeader(h){
  const k=String(h||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(/^(sku|code|itemcode|skucode)$/.test(k)) return "sku";
  if(/(drawing|tfp|serial)/.test(k)) return "tfpSerial";
  if(/(itemdesc|description|itemname|item|productname|name|material)/.test(k)) return "name";
  if(/category|group/.test(k)) return "category";
  if(/unit|uom/.test(k)) return "unit";
  if(/season/.test(k)) return "season";
  if(/(basicrate|rate|price|cost)/.test(k)) return "rate";
  if(/(openingstock|opening|openbal)/.test(k)) return "openingStock";
  if(/(availablestock|available|currentstock|closingstock|closing|stock|qty|quantity|balance)/.test(k)) return "qty";
  if(/(maxlevel|max|maximum)/.test(k)) return "max";
  if(/(leadtime|lead)/.test(k)) return "leadTimeDays";
  if(/(safetyfactor|safety)/.test(k)) return "safety";
  if(/(minlevel|min|minimum|reorder)/.test(k)) return "min";
  return null;
}

function loadItemsFromRows(rows){
  if(!rows || rows.length<2){ importMsg("No data rows found. First row must be column headers, with at least one data row below.", false); return; }
  const headers = rows[0].map(mapHeader);
  if(!headers.includes("sku")){ importMsg("Could not find an <b>SKU</b> column. Rename your code/SKU column to \"SKU\" and try again.", false); return; }
  let added=0, updated=0, skipped=0;
  const num = v => { const n=parseFloat(String(v).replace(/[^0-9.\-]/g,"")); return isNaN(n)?0:n; };
  for(let i=1;i<rows.length;i++){
    const r=rows[i]; const obj={};
    headers.forEach((f,idx)=>{ if(f) obj[f]=(r[idx]!==undefined?String(r[idx]).trim():""); });
    if(!obj.sku){ skipped++; continue; }
    const existing = db.items.find(x=>x.sku===obj.sku);
    const rec = existing || { sku:obj.sku };
    if(obj.name) rec.name=obj.name;
    if(obj.category) rec.category=obj.category;
    if(obj.unit) rec.unit=obj.unit;
    if(obj.season) rec.season=obj.season;
    if(obj.tfpSerial) rec.tfpSerial=obj.tfpSerial;
    if(obj.rate!==undefined && obj.rate!=="") rec.rate=num(obj.rate);
    if(obj.max!==undefined && obj.max!=="") rec.max=num(obj.max);
    if(obj.min!==undefined && obj.min!=="") rec.min=num(obj.min);
    if(obj.leadTimeDays!==undefined && obj.leadTimeDays!=="") rec.leadTimeDays=num(obj.leadTimeDays);
    if(obj.safety!==undefined && obj.safety!=="") rec.safety=num(obj.safety);
    if(obj.openingStock!==undefined && obj.openingStock!=="") rec.openingStock=num(obj.openingStock);
    if(obj.qty!==undefined && obj.qty!=="") rec.qty=num(obj.qty);
    if(!existing){
      rec.category = rec.category || (CATEGORIES[0]||"General");
      rec.unit = rec.unit || "PCS"; rec.season = rec.season || "REG/LOW";
      rec.rate = rec.rate||0; rec.max = rec.max||0;
      rec.leadTimeDays = rec.leadTimeDays||0; rec.safety = rec.safety||1.5;
      if(rec.openingStock===undefined) rec.openingStock = rec.qty||0;
      if(rec.qty===undefined) rec.qty = rec.openingStock||0;
      if(rec.category && !CATEGORIES.includes(rec.category)){ CATEGORIES.push(rec.category); if(!db.categories) db.categories=[]; if(!db.categories.includes(rec.category)) db.categories.push(rec.category); }
      db.items.push(rec); added++;
    } else updated++;
  }
  save(); logAction(`Imported items: ${added} added, ${updated} updated`);
  importMsg(`✅ Import done — <b>${added}</b> added, <b>${updated}</b> updated${skipped?`, ${skipped} skipped (no SKU)`:""}. Refreshing…`, true);
  setTimeout(()=>pageItems(), 1200);
}

function sheetCsvUrl(link){

  return `https://docs.google.com/spreadsheets/d/${idm[1]}/gviz/tq?tqx=out:csv&gid=${gid}`;
}

function mapVendorHeader(h){
  const k=String(h||"").toLowerCase().replace(/[^a-z0-9]/g,"");
  if(/(vendorname|suppliername|partyname|name|vendor|supplier|party|company)/.test(k)) return "name";
  if(/(contact|phone|mobile|number|tel)/.test(k)) return "contact";
  if(/(address|location|city)/.test(k)) return "address";
  if(/(gst|gstin|gstno|taxno)/.test(k)) return "gst";

/* helper: on-order (ordered - received) */
function onOrderQty(sku){
  return Math.max((typeof orderedQtyForSku==='function'?orderedQtyForSku(sku):0) - (typeof poReceivedQtyForSku==='function'?poReceivedQtyForSku(sku):0), 0);
}

/* #2 REORDER SUGGESTIONS ---------------------------------- */
function reorderList(){
  return db.items.map(it=>{
    const z = getZone(it);
    const onOrd = onOrderQty(it.sku);
    const suggest = Math.max(0, Math.ceil(Number(it.max||0) - Number(it.qty||0) - onOrd));
    const dl = daysLeft(it);
    return {it, z, onOrd, suggest, dl};
  }).filter(r => r.suggest>0)
    .sort((a,b)=>{ const rank={red:0,yellow:1,green:2,blue:3}; return (rank[a.z.cls]-rank[b.z.cls]) || (a.dl??999)-(b.dl??999); });
}
let reorderFilter = "all";
function setReorderFilter(f){ reorderFilter = (reorderFilter===f && f!=="all") ? "all" : f; pageReorder(); }

function exportReorderCSV(){
  const list = reorderList();
  const headers = ["Zone","SKU","Item","Available","Max","On order","Lead time (days)","Days left","Suggested order","Rate","Est. value"];
  const rows = list.map(r=>[r.z.name, r.it.sku, r.it.name, r.it.qty, r.it.max, r.onOrd||0, r.it.leadTimeDays||0, r.dl===null?'':r.dl, r.suggest, r.it.rate, Math.round(r.suggest*Number(r.it.rate||0))]);
  csvDownload("reorder-suggestions-"+new Date().toISOString().slice(0,10)+".csv", headers, rows);
}
function csvDownload(filename, headers, rows){
  const q = v => `"${String(v==null?"":v).replace(/"/g,'""')}"`;
  const lines = [headers.map(q).join(",")].concat(rows.map(r=>r.map(q).join(",")));
  const blob = new Blob([lines.join("\r\n")], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob); const a=document.createElement("a");
  a.href=url; a.download=filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function allSerials(){
  const set = new Set();
  db.transactions.forEach(t=>{ if(t.type==='OUT' && t.tfpSerial) set.add(t.tfpSerial); });
  (db.transformers||[]).forEach(t=>{ if(t.serial) set.add(t.serial); });
  return [...set];
}
function pageCostSheet(){
  const serials = allSerials();
  const sel = (document.getElementById('csSerial') && document.getElementById('csSerial').value) || serials[0] || "";
  document.getElementById("page").innerHTML = `
    <div class="page-title">Transformer Cost Sheet</div>
    <div class="page-subtitle">Full material cost breakup for one transformer serial (TFP) — every item issued to it, at FIFO cost, minus returns.</div>
    <div class="form"><div class="form-grid">
      <div class="form-group"><label>Transformer serial (TFP)</label>
        <select id="csSerial" onchange="pageCostSheet()">${serials.length?serials.map(s=>`<option value="${esc(s)}" ${s===sel?'selected':''}>${esc(s)}</option>`).join(''):`<option value="">No serials yet</option>`}</select></div>
    </div></div>
    <div id="csBody">${sel?costSheetBody(sel):'<div class="box"><p class="form-note">No transformer serials found. Issue material to a TFP serial (Store Issue / Outward) to see its cost sheet.</p></div>'}</div>`;
}
function costSheetBody(serial){
  const outs = db.transactions.filter(t=>t.type==='OUT' && t.tfpSerial===serial);
  if(!outs.length) return '<div class="box"><p class="form-note">No material issued to this serial yet.</p></div>';
  let total=0;
  const rows = outs.map(t=>{
    const q=Number(t.qty)||0, ret=Number(t.returned||0), cost=Number(t.cost)||0;
    const net = q>0 ? cost*((q-ret)/q) : cost; total+=net;
    const rate = q>0 ? cost/q : 0;
    return `<tr><td>${esc(t.date)}</td><td>${esc(t.sku||'-')}</td><td>${esc(t.itemName)}</td>
      <td>${q}${ret>0?` <span class="badge green">${ret} back</span>`:''}</td><td>${inr(Math.round(rate))}</td>
      <td>${esc(t.job||t.ref||'-')}</td><td><b>${inr(Math.round(net))}</b></td></tr>`;
  }).join("");
  const model = (db.transformers||[]).find(t=>t.serial===serial);
  return `<div class="box" style="border-top:4px solid var(--purple);">
    <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
      <div><h3 style="margin:0;">Serial ${esc(serial)}${model&&model.model?` · ${esc(model.model)}`:''}</h3>
      <span class="form-note">${outs.length} material line(s) · Total material cost <b>${inr(Math.round(total))}</b></span></div>
      <button class="btn" onclick="window.print()">Print cost sheet</button>
    </div>
    <div class="table-wrap" style="margin-top:12px;"><table>
      <tr><th>Date</th><th>SKU</th><th>Item</th><th>Qty</th><th>Rate</th><th>Job/Ref</th><th>Net cost</th></tr>
      ${rows}
      <tr style="font-weight:800; background:rgba(255,255,255,.04);"><td colspan="6" style="text-align:right;">TOTAL MATERIAL COST</td><td>${inr(Math.round(total))}</td></tr>
    </table></div>
  </div>`;
}

function imsShortcutHandler(e){
  const t = e.target || {};
  const tag = (t.tagName||"").toLowerCase();
  if(tag==="input" || tag==="select" || tag==="textarea" || t.isContentEditable) return;
  if(e.ctrlKey || e.metaKey || e.altKey) return;
  if(e.key==="?"){ e.preventDefault(); toggleShortcutHelp(); return; }
  const pg = SHORTCUTS[(e.key||"").toLowerCase()];
  if(pg){ e.preventDefault(); openPage(pg); }
}

  let ex = document.getElementById("scHelp");

/* Har wide table ke niche ek STICKY scrollbar - table jab tak screen pe hai
   tab tak niche hamesha dikhega, right columns ke liye poora niche nahi jaana padta */
function syncBottomScrollbars(){
  document.querySelectorAll(".table-wrap").forEach(tw=>{
    const overflow = tw.scrollWidth - tw.clientWidth > 4;
    let bar = tw.nextElementSibling;
    const hasBar = bar && bar.classList && bar.classList.contains("btm-scroll");
    if(!overflow){ if(hasBar) bar.remove(); return; }
    if(hasBar){ bar.firstElementChild.style.width = tw.scrollWidth+"px"; return; }
    bar = document.createElement("div");
    bar.className = "btm-scroll";
    const inner = document.createElement("div");
    inner.style.width = tw.scrollWidth+"px"; inner.style.height = "1px";
    bar.appendChild(inner);
    tw.parentNode.insertBefore(bar, tw.nextSibling);
    let lock = false;
    bar.addEventListener("scroll", ()=>{ if(lock) return; lock=true; tw.scrollLeft = bar.scrollLeft; lock=false; });
    tw.addEventListener("scroll", ()=>{ if(lock) return; lock=true; bar.scrollLeft = tw.scrollLeft; lock=false; });
  });
}
let _bsTimer = null;
function scheduleBottomScrollbars(){ clearTimeout(_bsTimer); _bsTimer = setTimeout(syncBottomScrollbars, 60); }
const _pageEl = document.getElementById("page");
if(_pageEl){ new MutationObserver(scheduleBottomScrollbars).observe(_pageEl, {childList:true, subtree:true}); }
window.addEventListener("resize", scheduleBottomScrollbars);
scheduleBottomScrollbars();

window.addEventListener("scroll", () => {
  const b = document.getElementById("toTop");
  if(b) b.classList.toggle("show", window.scrollY > 320);
});
</script>
